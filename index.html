<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>統率者戦 1人回し</title>
<style>
:root{--bg:#14161b;--panel:#1f232b;--panel2:#2a2f3a;--line:#353b48;--tx:#e8e8e8;--dim:#9aa3b2;--acc:#3a6ff7;--gold:#e0b84a;--red:#e05a4f;--green:#3fbf7f}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:14px;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:var(--maxw,900px);margin:0 auto;padding:8px 8px 90px}
h1{font-size:20px;margin:8px 0 4px}h2{font-size:16px;margin:16px 0 6px}h3{font-size:15px;margin:4px 0 10px}
.dim{color:var(--dim);font-size:12px}
.btn{background:var(--acc);border:none;border-radius:8px;padding:10px 14px;color:#fff;font-weight:600}
.btn.sec{background:#394150}.btn.warn{background:#b8443a}.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.4}
textarea{width:100%;min-height:220px;background:#0e1014;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:16px;-webkit-user-select:text;user-select:text}
input,select{background:#0e1014;color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:6px;font-size:14px}
.top{position:sticky;top:0;z-index:5;background:rgba(20,22,27,.96);border-bottom:1px solid var(--line);padding:6px 8px;display:flex;align-items:center;gap:8px}
.top .t{flex:1;font-weight:600;font-size:13px}
.ticker{font-size:12px;color:var(--gold);padding:4px 8px;min-height:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opps{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.pp{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px;min-width:0}
.pp.act{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.pp.lost{opacity:.35}
.pp .hd{display:flex;justify-content:space-between;align-items:baseline;gap:4px}
.pp .nm{font-weight:700;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.life{font-size:22px;font-weight:800}
.mini{font-size:11px;color:var(--dim)}
.chips{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.chip{background:var(--panel2);border:1px solid transparent;border-radius:4px;padding:2px 4px;font-size:11px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.tp{opacity:.45}.chip.cmd{border-color:var(--gold)}.chip.on{background:var(--acc)}
.chip.atk{border-color:var(--red)}
.me{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;margin-top:8px}
.me.act{border-color:var(--gold)}
.row{margin-top:6px}.rowt{font-size:11px;color:var(--dim);margin-bottom:3px}
.tiles{display:flex;flex-wrap:wrap;gap:6px}
.tiles.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
:root{--cs:1}
.tile{flex:0 0 auto;width:calc(72px*var(--cs));height:calc(98px*var(--cs));position:relative}
.tile .in{position:absolute;inset:0;border-radius:6px;background:var(--panel2) center/cover no-repeat;border:1px solid var(--line);overflow:hidden;transition:transform .15s}
.tile.tp .in{transform:rotate(90deg) scale(.72);opacity:.75}
.tile .n{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.72);font-size:calc(10px*var(--cs));line-height:1.25;padding:2px 3px;max-height:calc(40px*var(--cs));overflow:hidden}
.tile .c{position:absolute;right:2px;top:2px;background:rgba(0,0,0,.7);font-size:calc(9px*var(--cs));padding:0 3px;border-radius:3px}
.tile .pt{position:absolute;right:2px;top:44%;background:rgba(0,0,0,.8);font-weight:700;font-size:calc(12px*var(--cs));padding:0 4px;border-radius:3px}
.tile .pt.dmg{color:#ff8a80}
.tile .bd{position:absolute;left:2px;top:2px;font-size:calc(9px*var(--cs));background:var(--gold);color:#000;padding:0 3px;border-radius:3px;font-weight:700}
.tile .ab{position:absolute;left:0;right:0;top:40%;text-align:center;background:var(--red);font-size:calc(10px*var(--cs));font-weight:700}
.tile .ty{position:absolute;left:3px;top:calc(16px*var(--cs));right:3px;font-size:calc(9px*var(--cs));color:var(--dim)}
.tile.sel .in{outline:3px solid var(--acc)}
.tile .cnt{position:absolute;right:-4px;bottom:-4px;background:var(--acc);color:#fff;font-weight:800;font-size:calc(13px*var(--cs));padding:1px 6px;border-radius:10px;z-index:2}
.tile.atk .in{outline:3px solid var(--red)}
.zbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(20,22,27,.97);border-top:1px solid var(--line);padding:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom));display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.modal.hidden{display:none}
.shd{position:sticky;top:-14px;z-index:3;display:flex;justify-content:flex-end;margin:-14px -14px 6px;padding:10px 14px 6px;background:var(--panel);border-bottom:1px solid var(--line)}
.sheet{background:var(--panel);width:100%;max-width:var(--sheetw,560px);max-height:88vh;overflow:auto;border-radius:14px 14px 0 0;padding:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom))}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:14px}}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.acts .btn{font-size:13px;padding:9px 8px}
.cimg{width:100%;max-width:300px;display:block;margin:0 auto 8px;border-radius:10px}
.ctext{background:#0e1014;border-radius:8px;padding:8px;white-space:pre-wrap;font-size:13px;line-height:1.5}
.blk{border:1px solid var(--line);border-radius:8px;padding:6px;margin-bottom:6px}
.blk .opts{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.blk .opts .chip{font-size:13px;padding:5px 8px}
.log div{font-size:12px;padding:2px 0;border-bottom:1px solid #262b35}
.miss{color:#ff8a80}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg .chip{font-size:13px;padding:6px 10px}
.err{color:#ff8a80;font-size:13px;margin-top:6px}
.prog{margin-top:10px;background:#2b2510;border:1px solid #c9a227;border-radius:10px;padding:12px}
.prog .pl{color:#ffd54f;font-size:17px;font-weight:700;display:flex;align-items:center;gap:10px}
.prog .ps{color:#f3e5ab;font-size:12px;margin-top:6px}
.pbar{height:10px;background:#463b14;border-radius:5px;margin-top:8px;overflow:hidden}
.pbar div{height:100%;background:linear-gradient(90deg,#ffd54f,#ffb300);transition:width .3s}
.spin{width:18px;height:18px;border:3px solid #ffd54f;border-top-color:transparent;border-radius:50%;display:inline-block;animation:spin .8s linear infinite;flex:0 0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div>
<script>
'use strict';
/* ================= 基本ユーティリティ ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const rnd = n => Math.floor(Math.random() * n);
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const store = {
  get(k,d){ try{ const v=localStorage.getItem('cmdr.'+k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem('cmdr.'+k, JSON.stringify(v)); }catch(e){} }
};

/* ================= カード定義 ================= */
function mkDef(o){
  if(o && o.img && !o.thumb) o=Object.assign({},o,{thumb:String(o.img).replace('/normal/','/small/')});
  return Object.assign({name:'',ja:'',type:'',jtype:'',cost:'',cmc:0,power:null,toughness:null,loyalty:null,
    text:'',jtext:'',kw:[],produced:[],ci:[],img:null,thumb:null,script:null,unknown:false}, o);
}
function parseCost(cost){
  const pips=[]; let generic=0;
  (String(cost||'').match(/\{[^}]+\}/g)||[]).forEach(m=>{
    const s=m.slice(1,-1).toUpperCase();
    if(/^\d+$/.test(s)) generic+=+s;
    else if(s==='X'||s==='Y'||s==='Z') {}
    else if(s==='S') generic++;
    else { const opts=s.split('/').filter(x=>'WUBRGC'.includes(x)); pips.push(opts.length?opts:['C']); }
  });
  return {generic,pips};
}
const cmcOf = cost => { const {generic,pips}=parseCost(cost); return generic+pips.length; };
const colorsOf = cost => [...new Set(parseCost(cost).pips.flat().filter(c=>c!=='C'))];
const isLand = d => /\bLand\b/.test(d.type);
const isCreature = d => /\bCreature\b/.test(d.type);
const isPW = d => /\bPlaneswalker\b/.test(d.type);
const isInstSorc = d => /\b(Instant|Sorcery)\b/.test(d.type);
const isPermanentDef = d => !isInstSorc(d);
const isBasicLand = d => /\bBasic\b/.test(d.type) && /\bLand\b/.test(d.type);
const isLegendary = d => /\bLegendary\b/.test(d.type);
const num = v => { const n=parseInt(v,10); return isNaN(n)?0:n; };

const BASICS = {W:['平地','Plains'],U:['島','Island'],B:['沼','Swamp'],R:['山','Mountain'],G:['森','Forest'],C:['荒地','Wastes']};
function basicDef(c){ return mkDef({name:BASICS[c][1], ja:BASICS[c][0], type:'Basic Land — '+BASICS[c][1], jtype:'基本土地 — '+BASICS[c][0], produced:[c], ci:c==='C'?[]:[c]}); }
function basicByName(n){
  const sm=n.match(/^冠雪の(.+)$/); if(sm){ const b=basicByName(sm[1]); if(b){ b.ja=n; b.type=b.type.replace('Basic Land','Basic Snow Land'); return b; } }
  for(const k in BASICS){ if(n===BASICS[k][0]||n.toLowerCase()===BASICS[k][1].toLowerCase()) return basicDef(k); }
  return null;
}

/* ================= 仮NPCデッキ（後で指定デッキに差し替え） ================= */
function syn(ja, type, cost, p, t, kw=[], extra={}){
  return mkDef(Object.assign({syn:true, name:ja, ja, type, cost, cmc:cmcOf(cost), power:p, toughness:t, kw, ci:colorsOf(cost)}, extra));
}
const FX = {
  bolt:   (n)=>({effects:[{do:'damage',n,mode:'any target'}], text:`対象に${n}点のダメージを与える。`}),
  draw:   (n)=>({effects:[{do:'draw',n}], text:`カードを${n}枚引く。`}),
  ramp:   ()=>({effects:[{do:'ramp'}], priority:40, text:'基本土地を1枚探し、タップ状態で戦場に出す。'}),
  exile:  ()=>({effects:[{do:'exile',filter:'creature'}], text:'対戦相手のクリーチャー1体を追放する。'}),
  destroy:()=>({effects:[{do:'destroy',filter:'creature'}], text:'対戦相手のクリーチャー1体を破壊する。'}),
  gain:   (n)=>({effects:[{do:'gain',n},{do:'draw',n:1}], text:`${n}点のライフを得て、カードを1枚引く。`}),
};
function withFx(def, fx){ def.script=fx; def.jtext=fx.text; return def; }
function expand(list){ const out=[]; list.forEach(([f,n])=>{ for(let i=0;i<n;i++) out.push(f()); }); return out; }
/* 指定された対戦相手デッキ（晴れる屋形式）。null の席は仮デッキを使う */
const NPC_LISTS = [

/* ================= デッキテキスト解析（晴れる屋形式） ================= */
function cleanName(s){
  return s.replace(/^[《【]|[》】]$/g,'').replace(/[《》]/g,'').replace(/\s*[\[(（][A-Za-z0-9]{2,6}[\])）](\s*\S+)?\s*$/,'')
          .replace(/\s*\*F\*\s*$/i,'').trim();
}
function splitName(s){
  if(/\s\/\/\s/.test(s)) return /^[\x00-\x7F]+$/.test(s) ? {en:s} : {ja:s};
  const m = s.match(/^(.+?)\s*[\/／]\s*([A-Za-z].*)$/);
  if(m) return {ja:m[1].trim(), en:m[2].trim()};
  if(/^[\x00-\x7F]+$/.test(s)) return {en:s.replace(/_{2,}/g,'_____')};
  return {ja:s};
}
function parseDeck(text){
  const out={commander:[], main:[], skipped:[]};
  let section='main';
  for(const raw of text.split(/\r?\n|\t/)){
    const l=raw.trim(); if(!l) continue;
    const m = l.match(/^(\d+)\s*[xX×]?\s*(?=\S)(.+)$/);
    if(!m || !/^\d+\s*[xX×]?\s*[《【\[「]|^\d+\s*[xX×]?\s+\S/.test(l)){
      const h=l.replace(/[-ー－─=＝_\s【】\[\]（）()0-9０-９:：枚]/g,'');
      if(/^(統率者|コマンダー|commanders?)$/i.test(h)) section='commander';
      else if(/^(サイド(ボード)?|sideboard|maybe(board)?|検討中?)$/i.test(h)) section='side';
      else section='main';
      continue;
    }
    if(section==='side') continue;
    const e={n:+m[1], ...splitName(cleanName(m[2]))};
    (section==='commander'?out.commander:out.main).push(e);
  }
  return out;
}

/* ================= Scryfall 連携 ================= */
const SCRY='https://api.scryfall.com';
let lastReq=0;
async function sfetch(url, opt, tries=0){
  // Scryfallの上限：検索・collectionは1秒2回まで（500ms間隔）
  const gap=/\/cards\/(search|collection|named|random)/.test(url)?550:120;
  const wait=Math.max(0,lastReq+gap-Date.now()); if(wait) await sleep(wait);
  lastReq=Date.now();
  let r;
  try{ r=await fetch(url, Object.assign({headers:{'Accept':'application/json'}}, opt||{})); }
  catch(e){
    if(tries<2){ await sleep(1000*(tries+1)); return sfetch(url,opt,tries+1); }
    const err=new Error('network'); err.offline=true; throw err;
  }
  if(r.status===404) return null;
  if(r.status===429 || r.status>=500){
    if(tries<5){ await sleep(r.status===429?2000*(tries+1):1000*(tries+1)); return sfetch(url,opt,tries+1); }
  }
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}
const normJa = s => String(s||'').normalize('NFKC').replace(/[\s「」『』"']/g,'').replace(/[・･·]/g,'・').replace(/[,，、]/g,'、').replace(/[=＝]/g,'=').replace(/[:：]/g,':');
function defFromScry(c, jaHint){
  const f=(c.card_faces&&c.card_faces[0])||{};
  const has=k=>c[k]!=null&&c[k]!=='';
  const pick=k=>has(k)?c[k]:f[k];
  const img=c.image_uris||f.image_uris||{};
  return mkDef({
    name:c.name, ja:(c.printed_name||f.printed_name||jaHint||c.name),
    type:(f.type_line||c.type_line||''), jtype:(f.printed_type_line||c.printed_type_line||''),
    cost:(c.mana_cost||f.mana_cost||''), cmc:c.cmc||0,
    power:pick('power')??null, toughness:pick('toughness')??null, loyalty:pick('loyalty')??null,
    text:(c.card_faces? c.card_faces.map(x=>x.oracle_text).join('\n— 裏面 —\n') : c.oracle_text)||'',
    jtext:(c.card_faces? c.card_faces.map(x=>x.printed_text||'').filter(Boolean).join('\n— 裏面 —\n') : c.printed_text)||'',
    kw:c.keywords||[], produced:c.produced_mana||[], ci:c.color_identity||[],
    img:img.normal||null, thumb:img.small||null,
  });
}
async function searchAll(q){
  const res=[]; let url=`${SCRY}/cards/search?include_multilingual=true&unique=cards&q=${encodeURIComponent(q)}`;
  for(let page=0; url && page<4; page++){
    const d=await sfetch(url); if(!d) break;
    res.push(...(d.data||[])); url=d.has_more?d.next_page:null;
  }
  return res;
}
const nameMatch=(c,ja)=>{
  const n=normJa(ja); const faces=(c.card_faces||[]).map(f=>normJa(f.printed_name));
  if(normJa(c.printed_name)===n || faces.includes(n)) return true;
  if(faces.length && faces.join('//')===n.replace(/\/+/g,'//')) return true;
  if(n.includes('//') && faces.length && faces[0]===n.split('//')[0]) return true;
  return false;
};
/* entries: [{ja,en}]  →  {map: Map(key -> def), failed: [通信エラーで確認できなかった名前]} */
async function resolveCards(entries, onProg){
  const cache=store.get('cardcache',{});
  const out=new Map(); const need=[]; const failed=new Set();
  const keyOf=e=>e.ja||e.en;
  const seen=new Set();
  for(const e of entries){
    const k=keyOf(e);
    if(seen.has(k)) continue; seen.add(k);
    const b=basicByName(k); if(b){ out.set(k,b); continue; }
    if(cache[k]){ out.set(k, mkDef(cache[k])); continue; }
    need.push(e);
  }
  const total=need.length;
  const tried=new Set();
  const prog=()=>onProg&&onProg(`カード情報を取得中… ${need.filter(e=>out.has(keyOf(e))||tried.has(keyOf(e))).length}/${total}`);
  const save=()=>{ for(const [k,d] of out){ if(!basicByName(k)) cache[k]=d; } store.set('cardcache', cache); };
  prog();
  // 英語名つき → collection API でまとめて取得
  const en=need.filter(e=>e.en);
  for(let i=0;i<en.length;i+=75){
    const chunk=en.slice(i,i+75);
    try{
      const d=await sfetch(`${SCRY}/cards/collection`,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({identifiers:chunk.map(e=>({name:e.en}))})});
      (d?.data||[]).forEach(c=>{
        const e=chunk.find(x=>x.en.toLowerCase()===c.name.toLowerCase()||c.name.toLowerCase().startsWith(x.en.toLowerCase()+' //'));
        if(e) out.set(keyOf(e), defFromScry(c, e.ja));
      });
    }catch(err){ if(err.offline) throw err; }
    prog();
  }
  // collectionで見つからなかった英語名は、あいまい検索で1枚ずつ
  for(const e of en.filter(e=>!out.has(keyOf(e)))){
    try{ const c=await sfetch(`${SCRY}/cards/named?fuzzy=${encodeURIComponent(e.en)}`); if(c && c.object==='card') out.set(keyOf(e), defFromScry(c, e.ja)); }
    catch(err){ if(err.offline) throw err; failed.add(keyOf(e)); }
    prog();
  }
  // 日本語名 → 日本語版をまとめて完全一致検索
  let ja=need.filter(e=>!out.has(keyOf(e)) && e.ja);
  let okCalls=0;
  for(let i=0;i<ja.length;i+=8){
    const chunk=ja.slice(i,i+8);
    const q='lang:ja ('+chunk.map(e=>`!"${e.ja.replace(/"/g,'')}"`).join(' or ')+')';
    try{
      const list=await searchAll(q); okCalls++;
      for(const e of chunk){ const c=list.find(c=>nameMatch(c,e.ja)); if(c) out.set(keyOf(e), defFromScry(c, e.ja)); }
    }catch(err){ if(err.offline && !okCalls && !out.size) throw err; }
    prog(); save();
  }
  // 残りは1枚ずつ（完全一致 → 記号を除いた検索 → 全言語）
  ja=need.filter(e=>!out.has(keyOf(e)) && e.ja);
  for(const e of ja){
    const plain=e.ja.normalize('NFKC').replace(/[「」『』"]/g,'');
    const first=e.ja.split(/\s*\/\/\s*/)[0];
    const qs=[...(e.ja.includes('//')?[`lang:ja !"${first}"`]:[]), `lang:ja !"${e.ja.replace(/"/g,'')}"`, `lang:ja !"${plain}"`, `lang:ja ${plain.replace(/[、,:=・]/g,' ')}`, `lang:any ${plain.replace(/[、,:=・]/g,' ')}`];
    let c=null, err=false;
    for(const q of qs){
      try{ const list=await searchAll(q); c=list.find(x=>nameMatch(x,e.ja)) || null; }
      catch(ex){ err=true; break; }
      if(c) break;
    }
    if(c) out.set(keyOf(e), defFromScry(c, e.ja));
    else if(err) failed.add(keyOf(e));
    tried.add(keyOf(e)); prog(); save();
  }
  save();
  return {map:out, failed:[...failed]};
}
function placeholderDef(e){
  return mkDef({name:e.en||e.ja, ja:e.ja||e.en, unknown:true, type:''});
}

function moveTo(c, zone, opt={}){
  const from=G.players[c.ctrl]; const arr=from[c.zone];
  if(arr){ const i=arr.indexOf(c); if(i>=0) arr.splice(i,1); }
  const leftBf = c.zone==='bf' && zone!=='bf';
  const prevCtrl=c.ctrl;
  if(leftBf){
    for(const q of G.players) for(const a of [...q.bf]) if(a.attachedTo===c.uid){ if(/\bAura\b/.test(a.def.type)) moveTo(a,'gy'); else a.attachedTo=null; }
    const wasCre=isCreature(c.def);
    Object.assign(c,{tapped:false,dmg:0,p1:0,tp:0,tt:0,dtHit:false,counters:{},attacking:false,attachedTo:null,kwT:null});
    if(zone==='gy' && wasCre){ queueTrig(c,'dies_self',prevCtrl); fireFor(G.players[prevCtrl],'dies_other',null,c); }
    if(c.token){ c.zone='gone'; delete G.cards[c.uid]; return; }
  }
  const owner=G.players[c.owner];
  if(c.isCmd && (zone==='gy'||zone==='ex') && !opt.noRedirect && (owner.npc || G.settings.cmdAuto)){
    zone='cz'; log(`${nm(c)}は統率領域に戻った`);
  }
  c.ctrl = zone==='bf' ? (opt.ctrl ?? c.owner) : c.owner;
  const to=G.players[c.ctrl];
  if(zone==='lib'){ opt.bottom ? to.lib.push(c) : to.lib.unshift(c); }
  else to[zone].push(c);
  c.zone=zone;
  if(zone==='bf'){

    if(isLand(c.def) && /enters( the battlefield)? tapped\./i.test(c.def.text) && !/unless|if you control|you may pay/i.test(c.def.text)) c.tapped=true;
    if(isPW(c.def)) c.counters.loyalty=num(c.def.loyalty);
    queueTrig(c,'etb');
    if(isLand(c.def)) fireFor(G.players[c.ctrl],'landfall');
    if(isCreature(c.def)) fireCreatureEnters(c);
  }
}

function landColors(d){
  if(d.produced && d.produced.length) return d.produced.filter(x=>'WUBRGC'.includes(x));
  const out=[]; const t=d.type;
  if(/Plains/.test(t))out.push('W'); if(/Island/.test(t))out.push('U'); if(/Swamp/.test(t))out.push('B');
  if(/Mountain/.test(t))out.push('R'); if(/Forest/.test(t))out.push('G');
  return out;
}
function manaSources(p){
  const s=[];
  for(const c of p.bf){
    if(c.tapped) continue;
    const d=c.def;
    const n=Math.max(1,d.manaN||1);
    if(isLand(d)){ const col=landColors(d); if(col.length) for(let i=0;i<n;i++) s.push({card:c, colors:col}); }
    else if(d.produced && d.produced.length && !(isCreature(d) && c.sick && !hasKw(c,'Haste'))){
      for(let i=0;i<n;i++) s.push({card:c, colors:d.produced.filter(x=>'WUBRGC'.includes(x))});
    }
  }
  return s;
}
function findPayment(cost, sources, extra=0){
  const {generic,pips}=parseCost(cost);
  const avail=sources.slice(); const used=[];
  const ps=pips.slice().sort((a,b)=>a.length-b.length);
  for(const opts of ps){
    let best=-1, bestN=99;
    avail.forEach((s,i)=>{ if(s.colors.some(c=>opts.includes(c)) && s.colors.length<bestN){ best=i; bestN=s.colors.length; } });
    if(best<0) return null;
    used.push(avail.splice(best,1)[0]);
  }
  const g=generic+extra;
  if(avail.length<g) return null;
  avail.sort((a,b)=>a.colors.length-b.colors.length);
  used.push(...avail.slice(0,g));
  return used;
}

/* ---------- 状況起因処理 ---------- */
function checkSBA(){
  let changed=true, guard=0;
  while(changed && guard++<20){
    changed=false;
    for(const p of G.players){
      if(p.lost) continue;
      for(const c of [...p.bf]){
        if(isCreature(c.def)){
          const t=tou(c);
          const lethal = c.dmg>=t || (c.dtHit && c.dmg>0);
          if(t<=0 || (lethal && !hasKw(c,'Indestructible'))){ log(`${nm(c)}は死亡した`); moveTo(c,'gy'); changed=true; }
        } else if(isPW(c.def) && (c.counters.loyalty??1)<=0){ log(`${nm(c)}は墓地に置かれた`); moveTo(c,'gy'); changed=true; }
      }
    }
    for(const p of G.players){
      if(p.lost) continue;
      let why=null;
      if(p.life<=0) why='ライフが0以下になった';
      else if(Object.values(p.cmdDmg).some(v=>v>=21)) why='統率者ダメージが21点に達した';
      else if(p.drewEmpty) why='空のライブラリーから引こうとした';
      if(why){ lose(p,why); changed=true; }
    }
  }
  checkGameOver();
  drainTriggers();
}
function lose(p, why){
  p.lost=true; log(`★ ${p.name}は敗北した（${why}）`);
  for(const q of G.players){
    for(const z of ['bf','hand','gy','ex','lib','cz']){
      q[z]=q[z].filter(c=>{ if(c.owner===p.idx){ c.zone='gone'; return false; } return true; });
    }
  }
}
function checkGameOver(){
  if(G.over) return;
  if(G.players[0].lost){ G.over=true; setTimeout(()=>showResult(false),300); }
  else if(G.players.slice(1).every(p=>p.lost)){ G.over=true; setTimeout(()=>showResult(true),300); }
}

/* ---------- ダメージ ---------- */
function applyDamage(src, tg, n, combat){
  if(n<=0) return;
  const sp=G.players[src.ctrl];
  if(tg.player!=null){
    const p=G.players[tg.player]; if(p.lost) return;
    p.life-=n;
    if(combat && src.isCmd) p.cmdDmg[src.uid]=(p.cmdDmg[src.uid]||0)+n;
    if(combat) queueTrig(src,'cdmg');
    log(`${nm(src)} → ${p.name}に${n}点${combat&&src.isCmd?'（統率者ダメージ）':''}`);
  } else {
    const c=tg.card; if(c.zone!=='bf') return;
    if(isPW(c.def)) c.counters.loyalty=(c.counters.loyalty||0)-n;
    else { c.dmg+=n; if(hasKw(src,'Deathtouch')) c.dtHit=true; }
    log(`${nm(src)} → ${nm(c)}に${n}点`);
  }
  if(hasKw(src,'Lifelink') && sp && !sp.lost) gainLife(sp,n);
}

/* ---------- 戦闘 ---------- */
function canAttack(c, strict){
  if(!isCreature(c.def) || c.tapped || c.zone!=='bf') return false;
  if(c.sick && !hasKw(c,'Haste')) return false;
  if(hasKw(c,'Defender')) return false;
  if(strict && pow(c)<=0) return false;
  return true;
}
function canBlock(b,a){
  if(!isCreature(b.def) || b.tapped || b.zone!=='bf') return false;
  if(hasKw(a,'Flying') && !hasKw(b,'Flying') && !hasKw(b,'Reach')) return false;
  return true;
}
function killsIt(x,y){
  if(hasKw(y,'Indestructible')) return false;
  if(pow(x)<=0) return false;
  return hasKw(x,'Deathtouch') || pow(x) >= tou(y)-y.dmg;
}
const value = c => pow(c)+tou(c)+(c.isCmd?6:0)+c.def.cmc*0.5+c.def.kw.length;

async function resolveCombat(ap, plan){
  G.phase='combat';
  plan.forEach(({a})=>{ if(!hasKw(a,'Vigilance')) a.tapped=true; a.attacking=true; });
  const byDef={}; plan.forEach(x=>(byDef[x.d]??=[]).push(x));
  for(const d in byDef) log(`${ap.name}の攻撃 → ${G.players[d].name}：${byDef[d].map(x=>`${nm(x.a)}(${pow(x.a)}/${tou(x.a)})`).join('、')}`);
  plan.forEach(({a})=>queueTrig(a,'attack'));
  checkSBA();
  await beat();
  const blocks=new Map();
  for(const d of Object.keys(byDef).map(Number)){
    const dp=G.players[d]; if(dp.lost) continue;
    dp.grudge[ap.idx]=(dp.grudge[ap.idx]||0)+1;
    const res = dp.npc ? npcBlocks(dp, byDef[d]) : await humanBlocks(dp, ap, byDef[d]);
    for(const [k,v] of res){ blocks.set(k,v); log(`${dp.name}は${v.map(nm).join('と')}で${nm(G.cards[k])}をブロック`); }
  }
  if(blocks.size) await beat();
  dealCombatDamage(plan, blocks);
  plan.forEach(({a})=>a.attacking=false);
  checkSBA();
  render();
}
function dealCombatDamage(plan, blocks){
  const fs=c=>hasKw(c,'First strike')||hasKw(c,'Double strike');
  const ds=c=>hasKw(c,'Double strike');
  const all=[...plan.map(x=>x.a), ...[...blocks.values()].flat()];
  const steps=all.some(fs)?[1,2]:[2];
  for(const step of steps){
    const dealsNow=c=> step===1 ? fs(c) : (steps.length===1 || !fs(c) || ds(c));
    const ev=[];
    for(const {a,d} of plan){
      if(a.zone!=='bf') continue;
      const blockedBy=blocks.get(a.uid);
      const bl=(blockedBy||[]).filter(b=>b.zone==='bf');
      if(dealsNow(a)){
        let rem=pow(a);
        if(rem>0){
          if(!blockedBy) ev.push([a,{player:d},rem]);
          else {
            const dt=hasKw(a,'Deathtouch'), tr=hasKw(a,'Trample');
            bl.forEach((b,i)=>{
              if(rem<=0) return;
              const need=dt?1:Math.max(1,tou(b)-b.dmg);
              const give=(i===bl.length-1 && !tr)?rem:Math.min(rem,need);
              ev.push([a,{card:b},give]); rem-=give;
            });
            if(rem>0 && tr) ev.push([a,{player:d},rem]);
          }
        }
      }
      for(const b of bl) if(dealsNow(b) && pow(b)>0) ev.push([b,{card:a},pow(b)]);
    }
    ev.forEach(([s,t,n])=>applyDamage(s,t,n,true));
    checkSBA();
  }
}

/* ================= NPC の思考 ================= */
function npcBlocks(dp, attacks){
  const res=new Map();
  let avail=dp.bf.filter(b=>isCreature(b.def)&&!b.tapped);
  let incoming=attacks.reduce((s,x)=>s+pow(x.a),0);
  const sorted=[...attacks].sort((x,y)=>pow(y.a)-pow(x.a));
  for(const {a} of sorted){
    if(hasKw(a,'Menace')) continue;
    const cands=avail.filter(b=>canBlock(b,a)); if(!cands.length) continue;
    const byVal=(x,y)=>value(x)-value(y);
    const good=cands.filter(b=>killsIt(b,a)&&!killsIt(a,b)).sort(byVal);
    const safe=cands.filter(b=>!killsIt(a,b)).sort(byVal);
    const trade=cands.filter(b=>killsIt(b,a)&&value(b)<=value(a)).sort(byVal);
    let pick=good[0]||safe[0]||trade[0]||null;
    const cmdLethal=a.isCmd && (dp.cmdDmg[a.uid]||0)+pow(a)>=21;
    if(!pick && (incoming>=dp.life || cmdLethal)) pick=cands.sort(byVal)[0];
    if(pick){ res.set(a.uid,[pick]); avail=avail.filter(b=>b!==pick); if(!hasKw(a,'Trample')) incoming-=pow(a); }
  }
  return res;
}
function threatOf(p){ return p.bf.filter(c=>isCreature(c.def)).reduce((s,c)=>s+pow(c),0) + p.bf.length*0.3; }
function npcAttackPlan(p){
  const attackers=p.bf.filter(c=>canAttack(c,true)).sort((x,y)=>pow(y)-pow(x));
  const os=opps(p); const plan=[];
  // 守りに1体残すか：自分への脅威が大きければ最もタフなものを残す
  const maxThreat=Math.max(0,...os.map(threatOf));
  let keep=null;
  if(maxThreat>=p.life*0.6 && attackers.length>1) keep=[...attackers].sort((x,y)=>tou(y)-tou(x))[0];
  for(const a of attackers){
    if(a===keep) continue;
    let best=null, bestS=-1e9;
    for(const d of os){
      const bl=d.bf.filter(b=>canBlock(b,a));
      const dies=bl.some(b=>killsIt(b,a));
      let s=0;
      if(!bl.length) s+=30; else if(!dies) s+=15; else s-=35;
      s+=(40-d.life)*0.7 + (p.grudge[d.idx]||0)*4 + threatOf(d)*0.3;
      if(a.isCmd) s+=(d.cmdDmg[a.uid]||0)*0.8;
      if(d.life<=pow(a)) s+=60;
      s+=Math.random()*8;
      if(s>bestS){ bestS=s; best=d; }
    }
    if(best && bestS>0) plan.push({a, d:best.idx});
  }
  return plan;
}
/* ================= カードテキスト（英語Oracle）の解析 ================= */
const WORDNUM={a:1,an:1,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10};
const toN = w => { if(w==null) return 1; w=String(w).toLowerCase().replace(/^up to /,''); return WORDNUM[w] ?? (parseInt(w,10)||0); };
const KW_LIST=['Flying','First strike','Double strike','Deathtouch','Trample','Lifelink','Vigilance','Haste','Menace','Reach','Defender','Indestructible','Hexproof','Shroud'];
const BASIC_TYPES=['Plains','Island','Swamp','Mountain','Forest'];
const stripReminder = t => String(t||'').replace(/\([^)]*\)/g,'').replace(/[ \t]+\n/g,'\n').trim();
const kwIn = s => KW_LIST.filter(k=>new RegExp('\\b'+k+'\\b','i').test(s||''));

/* 「creature」「artifact or enchantment」「nonland permanent」などの記述でパーマネントを絞り込む */
function targetFilter(desc){
  const d=String(desc||'').toLowerCase();
  return c=>{
    const t=c.def.type.toLowerCase();
    if(/nonland permanent/.test(d)) return !/\bland\b/.test(t);
    if(/nonartifact creature/.test(d)) return /creature/.test(t)&&!/artifact/.test(t);
    if(/noncreature/.test(d) && /permanent/.test(d)) return !/creature/.test(t) && !/\bland\b/.test(t);
    if(/\bpermanent\b/.test(d) && !/creature|artifact|enchantment|land|planeswalker/.test(d)) return true;
    const kinds=['creature','artifact','enchantment','planeswalker','land','battle'].filter(k=>d.includes(k));
    if(!kinds.length) return false;
    return kinds.some(k=>t.includes(k));
  };
}
/* 「a creature」「an instant or sorcery」「a Dragon creature」などでカード（手札・ライブラリー・墓地）を絞り込む */
function cardFilter(desc){
  const raw=String(desc||'').replace(/^(a|an|up to (one|two|three))\s+/i,'').trim();
  const d=raw.toLowerCase();
  const kinds=['creature','artifact','enchantment','planeswalker','land','instant','sorcery','legendary','battle'].filter(k=>d.includes(k));
  const nonland=/nonland/.test(d), noncre=/noncreature/.test(d), basic=/basic/.test(d);
  const subs=(raw.match(/\b[A-Z][a-z]+\b/g)||[]).filter(w=>!['Aura','Equipment'].includes(w)||true);
  return c=>{
    const t=c.def.type;
    if(nonland && /\bLand\b/.test(t)) return false;
    if(noncre && /\bCreature\b/.test(t)) return false;
    if(basic && !/\bBasic\b/.test(t)) return false;
    if(subs.length && !subs.some(s=>t.includes(s))) return false;
    if(kinds.length && !kinds.filter(k=>k!=='legendary').some(k=>t.toLowerCase().includes(k)) && kinds.some(k=>k!=='legendary')) return false;
    if(kinds.includes('legendary') && !/Legendary/.test(t)) return false;
    return true;
  };
}
function spellMatches(filter, def){
  const f=String(filter||'').toLowerCase().trim();
  if(!f) return true;
  if(/noncreature/.test(f)) return !isCreature(def);
  if(/instant or sorcery/.test(f)) return isInstSorc(def);
  if(/creature/.test(f)) return isCreature(def);
  if(/artifact/.test(f)) return /Artifact/.test(def.type);
  if(/enchantment/.test(f)) return /Enchantment/.test(def.type);
  if(/legendary/.test(f)) return isLegendary(def);
  if(/dragon/.test(f)) return /Dragon/.test(def.type);
  return true;
}

function parseEffects(text){
  if(!text) return [];
  let s=stripReminder(text);
  if(/choose one —/i.test(s)){ const m=s.split(/\n•\s*/); if(m.length>1) s=m[1]; }
  const fx=[]; let m;
  const all=s.match(/(destroy|exile) all (creatures|nonland permanents)/i) || s.match(/(destroy|exile) all (artifacts and enchantments|artifacts|enchantments|planeswalkers)/i);
  if(all){ fx.push({do:'wrath', how:/exile/i.test(all[1])?'ex':'gy', what:all[2].toLowerCase()}); return fx; }
  if((m=s.match(/deals (\d+) damage to each creature/i)) && !/each creature you don't control/i.test(s)){ fx.push({do:'sweep', n:+m[1]}); return fx; }
  if((m=s.match(/counter target ([^.,]*?)spell/i))) fx.push({do:'counterspell', filter:m[1].trim()});
  if((m=s.match(/(?:^|\n)Add ((?:\{[WUBRGC]\})+)\.?/))) fx.push({do:'addMana', mana:m[1].replace(/[{}]/g,'')});
  if((m=s.match(/destroy (?:up to one )?target ([^.,;]+?)(?:\.|,|;| and | with| an opponent| you don't| that)/i))) fx.push({do:'destroy', filter:m[1]});
  if((m=s.match(/exile (?:up to one )?target ([^.,;]+?)(?:\.|,|;| and | with| an opponent| you don't| until| that)/i)) && !/card/.test(m[1])) fx.push({do:'exile', filter:m[1]});
  if((m=s.match(/return (?:up to one )?target ([^.]+?) to (?:its|their) owner'?s'? hands?/i)) && !/card|you control/.test(m[1])) fx.push({do:'bounce', filter:m[1]});
  if((m=s.match(/deals? (\d+) damage to (any target|target creature or planeswalker|target creature|each opponent|target player or planeswalker|target opponent|target player)/i))) fx.push({do:'damage', n:+m[1], mode:m[2].toLowerCase()});
  // リアニメイト
  if((m=s.match(/return (?:up to one )?target ([^.]*?)creature card from (your|a) graveyard to the battlefield/i))) fx.push({do:'reanimate', any:m[2].toLowerCase()==='a', loseCmc:/lose life equal to its mana value/i.test(s)});
  else if(/put target creature card from a graveyard onto the battlefield under your control/i.test(s) || /return enchanted creature card to the battlefield/i.test(s)) fx.push({do:'reanimate', any:true, loseCmc:/lose life equal to its mana value/i.test(s)});
  // 墓地から手札へ
  if((m=s.match(/return (up to (?:one|two|three) )?target ([^.]*?)cards? from your graveyard to your hand/i))) fx.push({do:'regrowth', n:m[1]?toN(m[1].trim()):1, filter:m[2]});
  // 土地サーチ（戦場へ）

    fx.push({do:'ramp', n:toN(m[1]), toHand:/other into your hand/i.test(s)?1:0, tapped:/battlefield tapped/i.test(s), basic:/basic/i.test(m[2]), subs:BASIC_TYPES.filter(x=>new RegExp(x,'i').test(m[2]))});

  else if((m=s.match(/search your library for (an? |up to one )?([^.,]*?)cards?(?: with [^,.]*)?[,.][^.]*?(put (?:it|that card|them) into your hand|put (?:it|that card) on top|on top of your library)/i))) fx.push({do:'tutor', filter:m[2], top:/on top/i.test(m[3])});
  else if((m=s.match(/search your library for (an? |up to one )?([^.,]*?)cards?(?: with [^,.]*)?[,.][^.]*?put (?:it|that card) onto the battlefield/i)) && !/\bland\b/i.test(m[2])) fx.push({do:'tutorBf', filter:m[2]});
  if(/put a land card from your hand onto the battlefield/i.test(s)) fx.push({do:'landFromHand'});
  if((m=s.match(/create (a|an|one|two|three|four|five|\d+) (tapped )?(\d+)\/(\d+) ([^.]*?)creature tokens?(?: with ([^.]+?))?(?:\.|,| and | that| for| attacking)/i))){
    fx.push({do:'token', n:toN(m[1]), p:m[3], t:m[4], name:m[5].trim().replace(/\b(white|blue|black|red|green|colorless|artifact|legendary|snow)\b ?(and )?/gi,'').trim()||'Token', kw:kwIn(m[6]), tapped:!!m[2]});
  }
  if((m=s.match(/create (a|an|one|two|three|four|\d+) (?:tapped )?treasure tokens?/i))) fx.push({do:'treasure', n:toN(m[1])});
  if((m=s.match(/put (a|an|one|two|\d+) \+1\/\+1 counters? on target creature you don't control/i))) fx.push({do:'counter', n:toN(m[1]), mode:'opp'});
  else if((m=s.match(/put (a|an|one|two|three|four|x|\d+) \+1\/\+1 counters? on (each creature you control|each other creature you control|target creature(?: you control)?|up to (?:one|two) target creatures?|it|this creature|~)/i)) && m[1].toLowerCase()!=='x')
    fx.push({do:'counter', n:toN(m[1]), mode:/each/i.test(m[2])?'each':/target/i.test(m[2])?'target':'self'});
  if((m=s.match(/target creature (?:you control )?gets \+(\d+)\/\+(\d+)(?: and gains ([^.]+?))? until end of turn/i))) fx.push({do:'pump', p:+m[1], t:+m[2], kw:kwIn(m[3])});
  if((m=s.match(/(?:^|[.\n] ?|, then |and |you )draws? (a|one|two|three|four|five|\d+) cards?/i)) && !/target player draws|each player draws|each opponent draws/i.test(s)) fx.push({do:'draw', n:toN(m[1])});
  if((m=s.match(/you (?:may )?gain (\d+) life/i))) fx.push({do:'gain', n:+m[1]});
  if(/you (?:may )?gain life equal to (?:that creature's|its|the entering creature's) toughness/i.test(s)) fx.push({do:'gainTough'});

  if((m=s.match(/each opponent sacrifices (a|an) (creature|nonland permanent|permanent|artifact|enchantment)/i))) fx.push({do:'edictOpp', filter:m[2]});
  return fx;
}

/* 誘発型能力 */
function parseTriggers(def){
  const out=[];
  for(const raw of stripReminder(def.text).split('\n')){
    const l=raw.trim(); if(!/^(when|whenever|at the beginning)/i.test(l)) continue;
    let ev=null, cond={}, m;
    const head=l.split(',')[0];
    if(/^whenever (another |a |one or more )?(other )?(nontoken )?creatures? (you control )?enters?\b/i.test(head) || /^whenever (another |a )?(nontoken )?creature enters( the battlefield)? under your control/i.test(head)){
      ev='cre_etb'; cond.other=/another|other/i.test(head); cond.yours=/you control|under your control/i.test(head); cond.nontoken=/nontoken/i.test(head);
    }
    else if(/^whenever you gain life/i.test(head)) ev='gainlife';
    else if(/\benters\b/i.test(head) && !/^whenever (another|a |an |one or more|a land)/i.test(head) && /^(when|whenever)/i.test(head)) ev='etb';
    else if(/^whenever a land( you control)? enters/i.test(head)) ev='landfall';
    else if(/^whenever [^,]*\battacks\b/i.test(head) && !/^whenever (a|another|one or more) (creature|creatures)/i.test(head)) ev='attack';
    else if(/^at the beginning of your upkeep/i.test(head)) ev='upkeep';
    else if(/^at the beginning of (your|each) end step/i.test(head)) ev='end';
    else if(/^at the beginning of combat on your turn/i.test(head)) ev='bcombat';
    else if((m=head.match(/^whenever you cast (?:a|an|your first)? ?(.*?)spell/i))){ ev='cast'; cond.filter=m[1].trim(); }
    else if(/deals combat damage to a player/i.test(head) && !/^whenever (a|one or more) creatures? you control/i.test(head)) ev='cdmg';
    else if(/^whenever (another )?(nontoken )?creature you control dies/i.test(head)) ev='dies_other';
    else if(/^when(ever)? [^,]*\bdies\b/i.test(head)) ev='dies_self';
    else if(/^whenever one or more \+1\/\+1 counters are put on/i.test(head)) ev='counters';
    if(!ev) continue;
    if(/\benters or dies\b/i.test(head)) out.push({ev:'dies_self', cond, fx:parseEffects(l.replace(/^[^,]*,\s*/,'')), text:l});
    out.push({ev, cond, fx:parseEffects(l.replace(/^[^,]*,\s*/,'')), text:l});
  }
  return out;
}
/* 護法：Ward {2} / Ward—Pay 3 life. / Ward—Discard a card. / Ward—Sacrifice a creature. など */
function parseWard(text){
  const s=stripReminder(text); let m;
  if((m=s.match(/(?:^|\n|, )Ward ((?:\{[^}]+\})+)/i))) return {mana:m[1]};
  if((m=s.match(/(?:^|\n|, )Ward\s*[—–-]\s*Pay (\d+) life/i))) return {life:+m[1]};
  if((m=s.match(/(?:^|\n|, )Ward\s*[—–-]\s*Discard (a|one|two) cards?/i))) return {discard:toN(m[1])};
  if((m=s.match(/(?:^|\n|, )Ward\s*[—–-]\s*Sacrifice (?:a|an) ([a-z ]+?)\./i))) return {sac:m[1].trim()};
  if((m=s.match(/(?:^|\n|, )Ward\s*[—–-]\s*([^\n.]+)/i))) return {other:m[1].trim()};
  return null;
}
const wardText = w => !w ? '' : w.mana ? w.mana : w.life!=null ? `${w.life}点のライフを支払う` : w.discard ? `カードを${w.discard}枚捨てる` : w.sac ? `${w.sac}を生け贄に捧げる` : w.other;
/* NPCが護法を払えそうか（対象選びの段階で使う） */
function wardAffordable(p, t){
  const w=t.def.ward; if(!w || t.ctrl===p.idx) return true;
  if(w.mana) return manaSources(p).length >= cmcOf(w.mana) + (G.evalCost||0);
  if(w.life!=null) return p.life > w.life + 5;
  if(w.discard) return p.hand.length > w.discard + (G.evalCost!=null?1:0);
  if(w.sac) return p.bf.some(targetFilter(w.sac));
  return false;
}
/* NPCが護法の対象を選んだときの支払い。払えなければ打ち消し（false） */
function npcPayWard(p, t, src){
  const w=t.def.ward; if(!w || t.ctrl===p.idx) return true;
  let ok=false;
  if(w.mana){ const pay=findPayment(w.mana, manaSources(p), 0); if(pay){ applyPayment(pay); ok=true; } }
  else if(w.life!=null){ if(p.life > w.life){ p.life-=w.life; ok=true; } }
  else if(w.discard){ if(p.hand.length>=w.discard){ for(let i=0;i<w.discard;i++){ const c=[...p.hand].sort((x,y)=>cardValue(x)-cardValue(y))[0]; moveTo(c,'gy'); } ok=true; } }
  else if(w.sac){ const c=p.bf.filter(targetFilter(w.sac)).sort((x,y)=>permValue(x)-permValue(y))[0]; if(c){ moveTo(c,'gy'); ok=true; } }
  if(ok) log(`${p.name}は${nm(t)}の護法（${wardText(w)}）を支払った`);
  else { log(`${nm(src||t)}は${nm(t)}の護法により打ち消された`); G.fizzle=true; }
  return ok;
}
function parseGrant(text, who){
  const s=stripReminder(text);
  const m=s.match(new RegExp(who+' creature gets ([+-]\\d+)/([+-]\\d+)','i'));
  const m2=s.match(new RegExp(who+' creature (?:gets [^.]*? and )?(?:has|gains) ([^.]+)','i'));
  const kw=m2?kwIn(m2[1]):[];
  if(!m && !kw.length) return null;
  return {p:m?+m[1]:0, t:m?+m[2]:0, kw};
}
function parseAnthem(text){
  const s=stripReminder(text); let m;
  if((m=s.match(/^(other )?creatures you control get \+(\d+)\/\+(\d+)(?: and have ([^.]+))?/im))) return {p:+m[2], t:+m[3], kw:kwIn(m[4]), other:!!m[1]};
  if((m=s.match(/^(other )?creatures you control have ([^.]+)/im)) && kwIn(m[2]).length) return {p:0,t:0,kw:kwIn(m[2]), other:!!m[1]};
  return null;
}
function parsePW(def){
  const out=[]; const jl=String(def.jtext||'').split('\n').filter(l=>/^[[［]?[+＋−\-–ー]?[0-9０-９XＸ]+[\]］]?\s*[：:]/.test(l.trim()));
  stripReminder(def.text).split('\n').forEach(l=>{
    const m=l.trim().match(/^([+−\-–]?)(\d+|X):\s*(.+)$/); if(!m) return;
    const n=m[2]==='X'?0:+m[2]; const cost=m[1]==='+'?n:(m[1]?-n:0);
    out.push({cost, text:m[3], jtext:jl[out.length]||'', fx:parseEffects(m[3])});

function manaInfo(def){
  const t=stripReminder(def.text); let n=1, oneShot=false; let m;
  if((m=t.match(/\{T\}[^:\n]*:\s*Add ((?:\{[WUBRGC]\})+)/))) n=(m[1].match(/\{/g)||[]).length;
  if(/Add two mana/i.test(t)) n=2; if(/Add three mana/i.test(t)) n=3;
  if(/\{T\}, Sacrifice (this|~)[^:\n]*: Add/i.test(t) || /Sacrifice (this|~)[^:\n]*: Add/i.test(t)) oneShot=true;
  return {n, oneShot};

/* カード定義に解析結果を付ける（あなた・NPC共通） */
function prepareDef(def){
  if(def.unknown) return def;
  if(def.syn){ def.fx=def.script?.effects||[]; def.trig=[]; if(def.script?.priority) def.fxPriority=def.script.priority; return def; }
  def.fx = isInstSorc(def) ? parseEffects(def.text) : [];
  def.trig = isInstSorc(def) ? [] : parseTriggers(def);
  def.grant = /\bEquipment\b/.test(def.type) ? parseGrant(def.text,'equipped') : (/\bAura\b/.test(def.type) ? parseGrant(def.text,'enchanted') : null);
  if(/\bAura\b/.test(def.type)){ const f=parseEffects(def.text).filter(e=>e.do==='reanimate'); if(f.length) def.fx=f; }
  def.anthem = parseAnthem(def.text);
  def.ward = parseWard(def.text);
  def.pwAbil = isPW(def) ? parsePW(def) : [];
  const eq=stripReminder(def.text).match(/\bEquip(?: [a-z ]+)? ((?:\{[^}]+\})+)/i); def.equipCost=eq?eq[1]:null;
  const mi=manaInfo(def); def.manaN=mi.n; def.oneShot=def.oneShot||mi.oneShot;

}
const prepareNpcDef = prepareDef;

/* 対応状況（効果一覧画面用） */
function analyzeDef(def){
  if(def.unknown) return {st:'none', lines:[]};
  if(isLand(def)) return {st:'land', lines:[]};
  const lines=stripReminder(def.text).split('\n').map(l=>l.trim()).filter(Boolean);
  if(!lines.length) return {st:'auto', lines:[]};
  const res=lines.map(l=>{
    let ok=false;
    if(isInstSorc(def)) ok=(def.fx||[]).length>0;
    else if(/^\{T\}[^:]*:\s*Add/i.test(l) || /^\{T\}, Sacrifice[^:]*: Add/i.test(l)) ok=(def.produced||[]).length>0;
    else if(l.split(/,\s*/).every(t=>KW_LIST.some(k=>t.toLowerCase().startsWith(k.toLowerCase())) || (/^ward/i.test(t) && def.ward))) ok=true;
    else if(/^Ward/i.test(l)) ok=!!def.ward;
    else if(/^Equip/i.test(l)) ok=!!def.equipCost;
    else if(/^(Equipped|Enchanted) creature/i.test(l)) ok=!!def.grant;
    else if(/^Enchant /i.test(l)) ok=true;
    else if(/^(other )?creatures you control (get|have)/i.test(l)) ok=!!def.anthem;
    else if(/^(when|whenever|at the beginning)/i.test(l)) ok=(def.trig||[]).some(t=>t.text===l && t.fx.length);
    else if(/^[+−\-–]?(\d+|X):/.test(l)) ok=(def.pwAbil||[]).some(a=>l.includes(a.text) && a.fx.length);
    return {l, ok};
  });
  const h=res.filter(r=>r.ok).length;
  return {st: h===res.length?'auto':(h?'partial':'none'), lines:res};
}
const FX_JA={draw:e=>`カードを${e.n}枚引く`, gain:e=>`${e.n}点のライフを得る`, drain:e=>`各対戦相手は${e.n}点失う`,
  ramp:e=>`土地を${e.n}枚探して戦場へ${e.toHand?'（1枚は手札へ）':''}`, destroy:e=>`対象を破壊（${e.filter}）`, exile:e=>`対象を追放（${e.filter}）`,
  bounce:e=>`対象を手札に戻す（${e.filter}）`, wrath:e=>`${e.what}をすべて${e.how==='ex'?'追放':'破壊'}`, sweep:e=>`各クリーチャーに${e.n}点`,

  counter:e=>`+1/+1カウンターを${e.n}個（${{each:'自軍全体',self:'自身',target:'対象',opp:'相手のクリーチャー'}[e.mode]}）`, pump:e=>`対象を+${e.p}/+${e.t}`,

const fxText = fx => (fx||[]).map(e=>(FX_JA[e.do]||(()=>e.do))(e)).join('／');

/* ================= 継続効果（装備・オーラ・全体強化） ================= */
function attachmentsOf(c){
  if(!G || c.zone!=='bf') return [];
  const out=[]; for(const p of G.players) for(const a of p.bf) if(a.attachedTo===c.uid) out.push(a);
  return out;
}
function bonus(c){
  let p=0,t=0; const kw=[];
  if(!G || c.zone!=='bf') return {p,t,kw};
  for(const a of attachmentsOf(c)){ const g=a.def.grant; if(g){ p+=g.p; t+=g.t; kw.push(...g.kw); } }
  if(isCreature(c.def)) for(const s of G.players[c.ctrl].bf){ const g=s.def.anthem; if(g && !(g.other && s===c)){ p+=g.p; t+=g.t; kw.push(...g.kw); } }
  return {p,t,kw};
}
function pow(c){ return num(c.def.power)+c.p1+c.tp+bonus(c).p; }
function tou(c){ return num(c.def.toughness)+c.p1+c.tt+bonus(c).t; }
function hasKw(c,k){
  const kl=k.toLowerCase();
  if(c.def.kw.some(x=>x.toLowerCase()===kl)) return true;
  if(c.kwT && c.kwT.includes(kl)) return true;
  return bonus(c).kw.some(x=>x.toLowerCase()===kl);
}
function applyPayment(pay){
  const seen=new Set();
  for(const s of pay){
    if(s.pool){ const pl=G.players[s.owner].pool; if(pl[s.colors[0]]>0) pl[s.colors[0]]--; continue; }
    if(seen.has(s.card)) continue; seen.add(s.card); s.card.tapped=true; if(s.card.def.oneShot && s.card.zone==='bf') moveTo(s.card,'gy');
  }
}
/* 浮きマナ（マナ・プール） */

const MANA_DOT={W:'#f3ecd0',U:'#4a90d9',B:'#6b5b6e',R:'#e05a4f',G:'#3fbf7f',C:'#b8b8b8'};
function poolSources(p){ const out=[]; for(const k of 'WUBRGC') for(let i=0;i<(p.pool?.[k]||0);i++) out.push({pool:true, owner:p.idx, colors:[k]}); return out; }

  const srcs=[...new Map(manaSources(p).map(s=>[s.card.uid,s])).values()];
  openSheet(`<h3>マナを出す</h3><p class="dim">タップしたパーマネントからマナを出して浮かせます。</p>
    ${srcs.map(s=>`<div class="blk"><b>${esc(nm(s.card))}</b>${(s.card.def.manaN||1)>1?` <span class="dim">（${s.card.def.manaN}点）</span>`:''}<div class="seg" style="margin-top:4px">${[...new Set(s.colors)].map(k=>`<button class="chip" data-tm="${s.card.uid}:${k}"><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${MANA_DOT[k]};margin-right:3px"></span>${MANA_JA[k]}</button>`).join('')}</div></div>`).join('')||'<p class="dim">マナを出せるアンタップ状態のパーマネントがありません</p>'}
    <div class="acts"><button class="btn" data-mback>浮きマナ画面へ</button></div>`,
    e=>{
      const b=e.target.closest('[data-tm]');
      if(b){ const [u,k]=b.dataset.tm.split(':'); const c=G.cards[+u]; if(c && !c.tapped){ const n=Math.max(1,c.def.manaN||1); c.tapped=true; p.pool[k]+=n; log(`${nm(c)}から${MANA_JA[k]}マナを${n}点出した`); if(c.def.oneShot) moveTo(c,'gy'); } tapForManaSheet(); render(); return; }
      if(e.target.closest('[data-mback]')) manaSheet();
    });
}

/* ================= 誘発の管理 ================= */
function queueTrig(src, ev, ctrlIdx, filterFn, ctx){
  const trs=(src.def.trig||[]).filter(t=>t.ev===ev && (!filterFn||filterFn(t,src)));
  for(const t of trs) G.trigQ.push({src, trig:t, ctrl:ctrlIdx??src.ctrl, ctx});
}
function fireFor(p, ev, filterFn, except, ctx){
  if(!p || p.lost) return;
  for(const s of [...p.bf]) if(s!==except) queueTrig(s, ev, p.idx, filterFn, ctx);
}
function gainLife(p, n){
  if(n<=0 || !p || p.lost) return;
  p.life+=n; fireFor(p,'gainlife');
}
function fireCreatureEnters(c){
  for(const q of G.players){
    if(q.lost) continue;
    fireFor(q,'cre_etb',(t,s)=>(!t.cond.yours || q.idx===c.ctrl) && (!t.cond.other || s!==c) && (!t.cond.nontoken || !c.token), null, {card:c});
  }
}
function drainTriggers(){
  if(!G || G.draining) return;
  G.draining=true;
  let guard=0;
  try{
    while(G.trigQ.length && guard++<60 && !G.over){
      const q=G.trigQ.shift(); const p=G.players[q.ctrl];
      if(!p || p.lost) continue;
      if(p.npc){
        if(!q.trig.fx.length) continue;
        log(`【誘発】${p.name}の${nm(q.src)}：${fxText(q.trig.fx)}`);
        G.ctx=q.ctx||null;
        G.fizzle=false;
        for(const e of q.trig.fx){ if(G.fizzle) break; if(e.do!=='counterspell') applyEffect(p, q.src, e); }
        G.fizzle=false;
        G.ctx=null;
      } else {
        if(G.pending.length<40) G.pending.push(q);
      }
    }
  } finally { G.draining=false; }
}

/* ================= 効果の適用 ================= */
function oppPermanents(p, filter, ignoreProt){
  return opps(p).flatMap(o=>o.bf.filter(c=>filter(c) && (ignoreProt || !(hasKw(c,'Hexproof')||hasKw(c,'Shroud')))));
}
function permValue(c){ return isCreature(c.def)?value(c):(isLand(c.def)?1:2+c.def.cmc); }
function cardValue(c){ return isCreature(c.def)?num(c.def.power)+num(c.def.toughness)+c.def.cmc:c.def.cmc+(isLand(c.def)?0.5:0); }
function bestTargetFor(p, e){
  if(e.do==='destroy'||e.do==='exile'||e.do==='bounce'){
    let list=oppPermanents(p, targetFilter(e.filter)).filter(c=>wardAffordable(p,c));
    if(e.do==='destroy') list=list.filter(c=>!hasKw(c,'Indestructible'));
    return list.sort((x,y)=>permValue(y)-permValue(x))[0]||null;
  }
  return null;
}
function boardValue(p, what){
  const f = what==='nonland permanents'||what==='nonland' ? (c=>!isLand(c.def)) : what==='creatures'||what==='creature' ? (c=>isCreature(c.def)) : (c=>new RegExp(what.replace(/s\b/g,'').split(' and ').join('|'),'i').test(c.def.type));
  return p.bf.filter(f).reduce((s,c)=>s+permValue(c),0);
}
function rampCands(p,e){ return p.lib.filter(c=>isLand(c.def) && (e.basic? isBasicLand(c.def):true) && (e.subs?.length ? e.subs.some(x=>c.def.type.includes(x)) : true)); }
function aiRampPicks(p,e){
  const need=new Set([...p.hand,...p.cz].flatMap(c=>colorsOf(c.def.cost)));
  const have=new Set(p.bf.flatMap(c=>isLand(c.def)?landColors(c.def):[]));
  const sc=c=>landColors(c.def).filter(x=>need.has(x)&&!have.has(x)).length*2+landColors(c.def).filter(x=>need.has(x)).length;
  const cands=rampCands(p,e).sort((x,y)=>sc(y)-sc(x));
  const out=[]; const used=new Set();
  for(const c of cands){ if(out.length>=e.n) break; if(used.has(c.def.name) && cands.some(x=>!used.has(x.def.name)&&!out.includes(x))) continue; out.push(c); used.add(c.def.name); }
  return out;
}
function aiDamageTarget(p,e){
  const os=opps(p);
  const face=(e.mode!=='target creature' && e.mode!=='target creature or planeswalker')?os.find(o=>o.life<=e.n):null;
  if(face) return {player:face.idx};
  if(/creature|any/.test(e.mode)){
    const ct=oppPermanents(p,c=>isCreature(c.def)).filter(c=>tou(c)-c.dmg<=e.n && value(c)>=4 && wardAffordable(p,c)).sort((x,y)=>value(y)-value(x))[0];
    if(ct) return ct;
  }
  if(/player|opponent|any/.test(e.mode)){ const t=[...os].sort((x,y)=>threatOf(y)-threatOf(x))[0]; if(t) return {player:t.idx}; }
  return null;
}
function gyCreatures(p,e){ return (e.any?G.players.filter(q=>!q.lost).flatMap(q=>q.gy):p.gy).filter(c=>isCreature(c.def)); }
function npcFxUseful(p, fx, src){
  if(!fx || !fx.length) return false;
  let useful=false;
  for(const e of fx){
    switch(e.do){
      case 'destroy': case 'exile': case 'bounce': { const t=bestTargetFor(p,e); if(!t || permValue(t)<(e.do==='bounce'?5:4)) return false; useful=true; break; }
      case 'damage': if(!aiDamageTarget(p,e) && e.mode!=='each opponent') return false; useful=true; break;
      case 'ramp': if(!rampCands(p,e).length) return false; useful=true; break;
      case 'wrath': { const mine=boardValue(p,e.what); const theirs=Math.max(...opps(p).map(o=>boardValue(o,e.what))); if(theirs < mine+10) return false; useful=true; break; }
      case 'sweep': { const kill=q=>q.bf.filter(c=>isCreature(c.def)&&tou(c)<=e.n&&!hasKw(c,'Indestructible')).reduce((s,c)=>s+value(c),0); if(Math.max(...opps(p).map(kill)) < kill(p)+8) return false; useful=true; break; }
      case 'reanimate': if(!gyCreatures(p,e).some(c=>cardValue(c)>=5)) return false; useful=true; break;
      case 'regrowth': if(!p.gy.some(cardFilterForRegrowth(e))) return false; useful=true; break;
      case 'tutor': case 'tutorBf': if(!p.lib.some(cardFilter(e.filter))) return false; useful=true; break;
      case 'counter': if(e.mode!=='self' && e.mode!=='opp' && !p.bf.some(c=>isCreature(c.def))) return false; useful=true; break;
      case 'pump': if(!p.bf.some(c=>isCreature(c.def))) return false; break;
      case 'edictOpp': if(!opps(p).some(o=>o.bf.some(targetFilter(e.filter)))) return false; useful=true; break;
      case 'counterspell': return false;
      case 'addMana': break;
      default: useful=true;
    }
  }
  return useful;
}
function npcEffectUseful(p, def){ return npcFxUseful(p, def.fx, null); }
const cardFilterForRegrowth = e => { const f=String(e.filter||'').trim(); return f ? cardFilter(f) : (()=>true); };

/* pick===undefined のときはNPC（AI）が自動で対象を選ぶ */
function applyEffect(p, src, e, pick){
  const auto = pick===undefined;
  const who = p.name;
  switch(e.do){
    case 'draw': drawN(p,e.n); log(`${who}はカードを${e.n}枚引いた`); break;
    case 'gain': gainLife(p,e.n); log(`${who}は${e.n}点のライフを得た`); break;
    case 'gainTough': { const c=G.ctx?.card; const n=c?Math.max(0,tou(c)):0; if(n){ gainLife(p,n); log(`${who}は${n}点のライフを得た`); } break; }
    case 'addMana': { if(!p.npc){ addPool(p,e.mana); log(`${who}は${e.mana}を浮かせた`); } break; }
    case 'proliferate': {
      // 自分のパーマネントのカウンターを1個ずつ増やす（相手のものは増やさない）
      const tg=p.bf.filter(c=>c.p1>0 || (isPW(c.def) && (c.counters.loyalty||0)>0));
      tg.forEach(c=>{ if(c.p1>0) c.p1++; if(isPW(c.def)) c.counters.loyalty=(c.counters.loyalty||0)+1; });
      log(`${who}は増殖した${tg.length?`（${tg.map(nm).join('、')}）`:''}`);
      if(tg.some(c=>c.p1>0)) fireFor(p,'counters');
      break;
    }
    case 'populate': {
      const tk=p.bf.filter(c=>c.token && isCreature(c.def)).sort((x,y)=>value(y)-value(x))[0];
      if(tk){ const c=inst(mkDef(tk.def),p.idx,{token:true}); c.zone='bf'; p.bf.push(c); log(`${who}は居住で${nm(tk)}のコピーを生成した`); fireCreatureEnters(c); }
      break;
    }
    case 'drain': opps(p).forEach(o=>o.life-=e.n); log(`各対戦相手は${e.n}点のライフを失った`); break;
    case 'ramp': {
      const picks=[].concat(auto?aiRampPicks(p,e):(pick||[])).filter(c=>c && c.zone==='lib');
      picks.forEach((land,i)=>{
        if(e.toHand && picks.length>1 && i===picks.length-1){ moveTo(land,'hand'); log(`${who}は${nm(land)}を手札に加えた`); }
        else { moveTo(land,'bf',{tapped:e.tapped}); log(`${who}は${nm(land)}を戦場に出した`); }
      });
      shuffle(p.lib); break;
    }
    case 'destroy': case 'exile': case 'bounce': {
      const t=auto?bestTargetFor(p,e):pick; if(!t || t.zone!=='bf') break;
      if(p.npc && !npcPayWard(p,t,src)) break;
      if(e.do==='destroy' && hasKw(t,'Indestructible')){ log(`${nm(t)}は破壊されない`); break; }
      const L={destroy:'破壊',exile:'追放',bounce:'手札に戻'};
      log(`${nm(src)}：${G.players[t.ctrl].name}の${nm(t)}を${L[e.do]}した`);
      moveTo(t, e.do==='exile'?'ex':e.do==='bounce'?'hand':'gy'); break;
    }
    case 'wrath': {
      const what=e.what;
      const f = /nonland/.test(what)?(c=>!isLand(c.def)) : /creature/.test(what)?(c=>isCreature(c.def)) : (c=>new RegExp(what.replace(/s\b/g,'').split(' and ').join('|'),'i').test(c.def.type));
      G.players.flatMap(q=>q.bf.filter(f)).forEach(c=>{ if(e.how==='gy' && hasKw(c,'Indestructible')) return; if(c.zone==='bf') moveTo(c,e.how); });
      log(`${nm(src)}：${what}をすべて${e.how==='ex'?'追放':'破壊'}した`); break;
    }
    case 'sweep': G.players.flatMap(q=>q.bf.filter(c=>isCreature(c.def))).forEach(c=>{ c.dmg+=e.n; }); log(`${nm(src)}：各クリーチャーに${e.n}点のダメージ`); break;
    case 'damage': {
      if(e.mode==='each opponent'){ opps(p).forEach(o=>applyDamage(src,{player:o.idx},e.n,false)); break; }
      const t=auto?aiDamageTarget(p,e):pick; if(!t) break;
      if(t.player==null && p.npc && !npcPayWard(p,t,src)) break;
      if(t.player!=null) applyDamage(src,{player:t.player},e.n,false); else applyDamage(src,{card:t},e.n,false);
      break;
    }
    case 'token': {
      for(let i=0;i<e.n;i++){
        const d=mkDef({name:e.name, ja:e.name+'トークン', type:'Token Creature', power:e.p, toughness:e.t, kw:e.kw});
        const c=inst(d,p.idx,{token:true}); c.zone='bf'; c.tapped=e.tapped; p.bf.push(c); fireCreatureEnters(c);
      }
      log(`${who}は${e.p}/${e.t}の${e.name}トークンを${e.n}体生成した`); break;
    }
    case 'treasure': {
      for(let i=0;i<e.n;i++){
        const d=mkDef({name:'Treasure', ja:'宝物', type:'Token Artifact — Treasure', produced:['W','U','B','R','G'], oneShot:true, text:'{T}, Sacrifice this artifact: Add one mana of any color.'});
        const c=inst(d,p.idx,{token:true}); c.zone='bf'; p.bf.push(c);
      }
      log(`${who}は宝物トークンを${e.n}個生成した`); break;
    }
    case 'counter': {
      let tg=[];
      if(e.mode==='each') tg=p.bf.filter(c=>isCreature(c.def));
      else if(e.mode==='self') tg=(src&&src.zone==='bf')?[src]:[];
      else if(!auto) tg=pick?[pick]:[];
      else if(e.mode==='opp') tg=oppPermanents(p,c=>isCreature(c.def)&&!c.def.ward).sort((x,y)=>value(x)-value(y)).slice(0,1);
      else tg=p.bf.filter(c=>isCreature(c.def)).sort((x,y)=>value(y)-value(x)).slice(0,1);
      tg=tg.filter(c=>c&&c.zone==='bf');
      tg.forEach(c=>c.p1+=e.n);
      if(tg.length){
        log(`${tg.map(nm).join('、')}に+1/+1カウンターを${e.n}個置いた`);
        new Set(tg.map(c=>c.ctrl)).forEach(i=>fireFor(G.players[i],'counters'));
      }
      break;
    }
    case 'pump': {
      const t=auto?p.bf.filter(c=>isCreature(c.def)).sort((x,y)=>pow(y)-pow(x))[0]:pick; if(!t||t.zone!=='bf') break;
      t.tp+=e.p; t.tt+=e.t; if(e.kw?.length) t.kwT=[...(t.kwT||[]),...e.kw.map(k=>k.toLowerCase())];
      log(`${nm(t)}はターン終了時まで+${e.p}/+${e.t}`); break;
    }
    case 'reanimate': {
      const t=auto?gyCreatures(p,e).sort((x,y)=>cardValue(y)-cardValue(x))[0]:pick; if(!t||t.zone!=='gy') break;
      moveTo(t,'bf',{ctrl:p.idx}); if(e.loseCmc) p.life-=t.def.cmc;
      log(`${who}は${nm(t)}を墓地から戦場に戻した`); break;
    }
    case 'regrowth': {
      const picks=[].concat(auto?[...p.gy].filter(cardFilterForRegrowth(e)).sort((x,y)=>cardValue(y)-cardValue(x)).slice(0,e.n):(pick||[]));
      picks.filter(c=>c&&c.zone==='gy').forEach(c=>{ moveTo(c,'hand',{noRedirect:true}); log(`${who}は${nm(c)}を墓地から手札に戻した`); });
      break;
    }
    case 'tutor': {
      let t=pick;
      if(auto){
        const lands=p.bf.filter(c=>isLand(c.def)).length;
        const c=p.lib.filter(cardFilter(e.filter));
        t=c.filter(x=>!isLand(x.def)&&x.def.cmc<=lands+2).sort((x,y)=>cardValue(y)-cardValue(x))[0]||c[0];
      }
      if(!t||t.zone!=='lib') break;
      shuffle(p.lib);
      if(e.top){ p.lib.splice(p.lib.indexOf(t),1); p.lib.unshift(t); log(`${who}はカードを1枚探してライブラリーの一番上に置いた`); }
      else { moveTo(t,'hand'); log(`${who}はカードを1枚探して手札に加えた`); }
      break;
    }
    case 'tutorBf': {
      let t=pick;
      if(auto) t=p.lib.filter(cardFilter(e.filter)).sort((x,y)=>cardValue(y)-cardValue(x))[0];
      if(!t||t.zone!=='lib') break;
      moveTo(t,'bf'); shuffle(p.lib); log(`${who}は${nm(t)}を探して戦場に出した`); break;
    }
    case 'mill': { for(let i=0;i<e.n && p.lib.length;i++){ const c=p.lib[0]; moveTo(c,'gy',{noRedirect:true}); } log(`${who}は${e.n}枚切削した`); break; }
    case 'discardOpp': {
      opps(p).forEach(o=>{ for(let i=0;i<e.n && o.hand.length;i++){ const c=o.hand[rnd(o.hand.length)]; moveTo(c,'gy'); log(`${o.name}は${nm(c)}を捨てた`); } }); break;
    }
    case 'edictOpp': {
      opps(p).forEach(o=>{ const c=o.bf.filter(targetFilter(e.filter)).sort((x,y)=>permValue(x)-permValue(y))[0]; if(c){ moveTo(c,'gy'); log(`${o.name}は${nm(c)}を生け贄に捧げた`); } }); break;
    }
    case 'landFromHand': {
      const t=auto?p.hand.find(c=>isLand(c.def)):pick; if(t&&t.zone==='hand'){ moveTo(t,'bf'); log(`${who}は${nm(t)}を戦場に出した`); } break;
    }
  }
  checkSBA();
}

/* ================= あなた側：対象を選んで自動処理 ================= */
function targetCands(e, src){
  const p=ME(); const all=G.players.filter(q=>!q.lost);
  const lbl=c=>`${nm(c)}（${G.players[c.zone==='bf'?c.ctrl:c.owner].name}）${isCreature(c.def)&&c.zone==='bf'?` ${pow(c)}/${tou(c)}`:''}`;
  switch(e.do){
    case 'destroy': case 'exile': case 'bounce': return {multi:1, items:all.flatMap(q=>q.bf).filter(targetFilter(e.filter)).map(c=>({v:c,l:lbl(c)}))};
    case 'damage':
      if(e.mode==='each opponent') return null;
      return {multi:1, items:[...(/player|opponent|any/.test(e.mode)?all.filter(q=>q!==p||/any|player/.test(e.mode)).map(q=>({v:{player:q.idx},l:`${q.name}（ライフ${q.life}）`})):[]),
                              ...(/creature|any|planeswalker/.test(e.mode)?all.flatMap(q=>q.bf).filter(c=>isCreature(c.def)||isPW(c.def)).map(c=>({v:c,l:lbl(c)})):[])]};
    case 'counter': if(e.mode==='target'||e.mode==='opp') return {multi:1, items:all.flatMap(q=>q.bf).filter(c=>isCreature(c.def)&&(e.mode==='opp'?c.ctrl!==0:true)).map(c=>({v:c,l:lbl(c)}))}; return null;
    case 'pump': return {multi:1, items:all.flatMap(q=>q.bf).filter(c=>isCreature(c.def)).map(c=>({v:c,l:lbl(c)}))};
    case 'reanimate': return {multi:1, items:gyCreatures(p,e).map(c=>({v:c,l:lbl(c)}))};
    case 'regrowth': return {multi:e.n, items:p.gy.filter(cardFilterForRegrowth(e)).map(c=>({v:c,l:nm(c)}))};
    case 'tutorBf': return {multi:1, items:p.lib.filter(cardFilter(e.filter)).sort((x,y)=>nm(x).localeCompare(nm(y),'ja')).map(c=>({v:c,l:nm(c)}))};
    case 'tutor': return {multi:1, items:p.lib.filter(cardFilter(e.filter)).sort((x,y)=>nm(x).localeCompare(nm(y),'ja')).map(c=>({v:c,l:nm(c)}))};
    case 'ramp': return {multi:e.n, items:[...new Map(rampCands(p,e).map(c=>[c.def.name,c])).values()].map(c=>({v:c,l:nm(c)})), note:e.toHand?'最後に選んだ1枚は手札に入ります':''};
    case 'landFromHand': return {multi:1, items:p.hand.filter(c=>isLand(c.def)).map(c=>({v:c,l:nm(c)}))};
  }
  return null;
}
function pickTarget(e, src){
  const tc=targetCands(e,src);
  if(!tc) return Promise.resolve(undefined);
  return new Promise(res=>{
    const sel=[];
    const draw=()=>{
      openSheet(`<h3>${esc(nm(src))}：${esc((FX_JA[e.do]||(()=>e.do))(e))}</h3>
        <p class="dim">${tc.multi>1?`最大${tc.multi}つまで選択`:'対象を選んでください'}${tc.note?`。${esc(tc.note)}`:''}</p>
        <div class="seg">${tc.items.map((it,i)=>`<button class="chip ${sel.includes(i)?'on':''}" data-pk="${i}">${esc(it.l)}</button>`).join('')||'<span class="dim">選べる対象がありません</span>'}</div>
        <div class="acts"><button class="btn" data-pok ${tc.multi>1||sel.length?'':'disabled'}>決定</button><button class="btn sec" data-pskip>この効果を飛ばす</button></div>`,
        ev=>{
          const b=ev.target.closest('[data-pk]');
          if(b){ const i=+b.dataset.pk; if(sel.includes(i)) sel.splice(sel.indexOf(i),1); else { if(sel.length>=tc.multi) sel.shift(); sel.push(i); } draw(); return; }
          if(ev.target.closest('[data-pskip]')){ closeSheet(true); res(null); return; }
          if(ev.target.closest('[data-pok]')){ closeSheet(true); const v=sel.map(i=>tc.items[i].v); res(tc.multi>1?v:v[0]); }
        }, true, ()=>res(null));
    };
    draw();
  });
}
async function resolveForHuman(src, fx){
  const p=ME();
  for(const e of fx){
    if(G.over) return;
    if(e.do==='counterspell'){ log('打ち消しは手動で処理してください'); continue; }
    const pick=await pickTarget(e, src);
    if(pick===null) continue;
    const tgt=(pick && !Array.isArray(pick) && pick.def) ? pick : null;
    if(tgt && tgt.zone==='bf' && tgt.ctrl!==0 && tgt.def.ward){
      const ok=await humanPayWard(tgt, src);
      if(!ok){ log(`${nm(src)}は${nm(tgt)}の護法により打ち消された`); break; }
    }
    applyEffect(p, src, e, pick===undefined && targetCands(e,src)===null ? undefined : pick);
  }
  render();
}
async function humanPayWard(t, src){
  const p=ME(); const w=t.def.ward;
  const lbl = w.mana ? `${w.mana}を支払う（自動）` : w.life!=null ? `${w.life}点のライフを支払う` : w.discard ? `カードを${w.discard}枚捨てる（手動で捨てた）` : '支払った（手動）';
  const r=await choiceSheet(`<h3>護法</h3><p><b>${esc(nm(t))}</b>は護法（${esc(wardText(w))}）を持っています。支払わないと${esc(nm(src))}は打ち消されます。</p>`, [lbl,'支払わない（打ち消される）'], 1);
  if(r!==0) return false;
  if(w.mana){
    const pay=findPayment(w.mana, [...poolSources(p), ...manaSources(p)], 0);
    if(!pay){ const r2=await choiceSheet(`<h3>マナが足りません</h3><p class="dim">護法 ${esc(w.mana)} を自動で支払えませんでした。</p>`, ['手動で支払った','支払わない（打ち消される）'], 1); return r2===0; }
    applyPayment(pay);
  } else if(w.life!=null){ p.life-=w.life; checkSBA(); }
  log(`あなたは${nm(t)}の護法（${wardText(w)}）を支払った`);
  return true;
}
function pendingSheet(){
  const list=G.pending;
  if(!list.length){ closeSheet(true); render(); return; }
  openSheet(`<h3>あなたの誘発型能力（${list.length}件）</h3><p class="dim">処理したものから消してください。</p>`+
    list.map((q,i)=>`<div class="blk"><b>${esc(nm(q.src))}</b><div class="dim" style="margin:3px 0">${esc(q.trig.text)}</div>
      ${q.trig.fx.length?`<div>自動処理：${esc(fxText(q.trig.fx))}</div>`:'<div class="dim">自動処理できない能力です（手動で処理）</div>'}
      <div class="acts">${q.trig.fx.length?`<button class="btn sm" data-pa="${i}">自動で処理</button>`:''}<button class="btn sec sm" data-pd="${i}">処理済みにする</button></div></div>`).join('')+
    `<div class="acts"><button class="btn sec" data-pall>すべて処理済みにする</button></div>`,
    async e=>{
      const a=e.target.closest('[data-pa]'), d=e.target.closest('[data-pd]');
