      if(a){ const q=list.splice(+a.dataset.pa,1)[0]; closeSheet(true); G.ctx=q.ctx||null; await resolveForHuman(q.src,q.trig.fx); G.ctx=null; pendingSheet(); }
    });
}

/* ================= NPC：打ち消し・装備・プレインズウォーカー ================= */
function npcTryCounter(caster, card){
  for(const q of opps(caster)){
    if(!q.npc) continue;
    for(const cs of q.hand){
      const e=(cs.def.fx||[]).find(x=>x.do==='counterspell'); if(!e) continue;
      if(!spellMatches(e.filter, card.def)) continue;
      const pay=findPayment(cs.def.cost, manaSources(q), 0); if(!pay) continue;
      const fx=card.def.fx||[];
      const hurtsMe = fx.some(x=>x.do==='wrath') || card.isCmd || card.def.cmc>=5 || (fx.some(x=>['destroy','exile','bounce'].includes(x.do)) && q.bf.some(c=>permValue(c)>=6));
      if(!hurtsMe || Math.random()<0.25) continue;
      applyPayment(pay); moveTo(cs,'gy');
      log(`${q.name}は${nm(cs)}で${nm(card)}を打ち消した！`);
      return q;
    }
  }
  return null;
}
function npcEquip(p){
  for(const eq of p.bf.filter(c=>/\bEquipment\b/.test(c.def.type) && c.def.equipCost)){
    const cur=eq.attachedTo && G.cards[eq.attachedTo];
    if(cur && cur.zone==='bf' && cur.ctrl===p.idx) continue;
    const cre=p.bf.filter(c=>isCreature(c.def)).sort((x,y)=>(pow(y)+(canAttack(y,false)?3:0)+(hasKw(y,'Flying')?2:0))-(pow(x)+(canAttack(x,false)?3:0)+(hasKw(x,'Flying')?2:0)))[0];
    if(!cre) continue;
    const pay=findPayment(eq.def.equipCost, manaSources(p), 0); if(!pay) continue;
    applyPayment(pay); eq.attachedTo=cre.uid;
    log(`${p.name}は${nm(eq)}を${nm(cre)}に装備した`);
  }
}
function npcUsePW(p){
  for(const c of p.bf.filter(c=>isPW(c.def))){
    if(c.pwUsed===G.turn) continue;
    const loy=c.counters.loyalty||0;
    const abil=(c.def.pwAbil||[]);
    const ok=abil.filter(a=>loy+a.cost>=(a.cost<0?1:0));
    const minus=ok.filter(a=>a.cost<0 && a.fx.length && npcFxUseful(p,a.fx,c)).sort((x,y)=>x.cost-y.cost)[0];
    const plus=ok.filter(a=>a.cost>=0).sort((x,y)=>(y.fx.length?1:0)-(x.fx.length?1:0)||y.cost-x.cost)[0];
    const a=minus||plus; if(!a) continue;
    c.pwUsed=G.turn; c.counters.loyalty=loy+a.cost;
    log(`${p.name}は${nm(c)}の[${a.cost>0?'+':''}${a.cost}]能力を起動した${a.fx.length?`：${fxText(a.fx)}`:''}`);
    G.fizzle=false; for(const e of a.fx){ if(G.fizzle) break; applyEffect(p,c,e); } G.fizzle=false;
    checkSBA();
  }
}
function attachAura(p, card){
  if(!card.def.grant) return;
  const t=p.bf.filter(c=>isCreature(c.def)).sort((x,y)=>value(y)-value(x))[0];
  if(t){ card.attachedTo=t.uid; log(`${nm(card)}を${nm(t)}につけた`); }
}

function npcChooseSpell(p){
  const src=manaSources(p); const cands=[];
  for(const c of p.cz){
    const pay=findPayment(c.def.cost, src, 2*(p.tax[c.uid]||0));
    if(pay) cands.push({card:c, pay, score:100+c.def.cmc});
  }
  for(const c of p.hand){
    if(isLand(c.def)) continue;
    if(c.def.unknown || /\{X\}/.test(c.def.cost)) continue;
    G.evalCost=c.def.cmc||cmcOf(c.def.cost); const useful=!isInstSorc(c.def) || npcEffectUseful(p,c.def); G.evalCost=0;
    if(!useful) continue;
    if(/\bAura\b/.test(c.def.type)){
      const okRe=(c.def.fx||[]).length && npcEffectUseful(p,c.def);
      const okGr=c.def.grant && (c.def.grant.p>0||c.def.grant.kw.length) && p.bf.some(x=>isCreature(x.def));
      if(!okRe && !okGr) continue;
    }
    const pay=findPayment(c.def.cost, src, 0); if(!pay) continue;
    let score=c.def.cmc*10 + (c.def.fxPriority||0);
    if(c.def.produced?.length && !isLand(c.def)) score+=25;
    if(/\bEquipment\b/.test(c.def.type)) score-=15;
    cands.push({card:c, pay, score});
  }
  cands.sort((a,b)=>b.score-a.score);
  return cands[0]||null;
}
async function npcCast(p, {card, pay}){
  applyPayment(pay);
  const fromCz=card.zone==='cz';
  if(fromCz){ p.tax[card.uid]=(p.tax[card.uid]||0)+1; }
  log(`${p.name}は${nm(card)}${fromCz?'（統率者）':''}を唱えた`);
  fireFor(p,'cast',t=>spellMatches(t.cond.filter, card.def));
  if(npcTryCounter(p, card)){ moveTo(card,'gy'); checkSBA(); return; }
  if(G.settings.confirmSpells){
    const ok=await choiceSheet(`<h3>${esc(p.name)}が呪文を唱えた</h3>${detailHTML(card)}`, ['解決させる','打ち消す（墓地へ）'], 0);
    if(ok===1){ log(`${nm(card)}は打ち消された`); moveTo(card,'gy'); return; }
  } else await beat();
  const isAuraRe=/\bAura\b/.test(card.def.type) && (card.def.fx||[]).length;
  if(isPermanentDef(card.def) && !isAuraRe){ moveTo(card,'bf'); if(/\bAura\b/.test(card.def.type)) attachAura(p,card); checkSBA(); }
  else { G.fizzle=false; for(const e of (card.def.fx||[])){ if(G.fizzle) break; if(e.do!=='counterspell') applyEffect(p,card,e); } G.fizzle=false; if(card.zone==='hand'||card.zone==='cz') moveTo(card,'gy'); checkSBA(); }
}
function npcPlayLand(p){
  if(p.landPlayed) return;
  const lands=p.hand.filter(c=>isLand(c.def)); if(!lands.length) return;
  const need=new Set(p.hand.flatMap(c=>colorsOf(c.def.cost)));
  lands.sort((x,y)=>landColors(y.def).filter(c=>need.has(c)).length-landColors(x.def).filter(c=>need.has(c)).length);
  const l=lands[0]; moveTo(l,'bf'); p.landPlayed=true; log(`${p.name}は${nm(l)}をプレイした`);
  crackFetch(p,l);
}
function crackFetch(p,l){
  const t=l.def.text||'';
  if(landColors(l.def).length || !/search your library for/i.test(t) || !/sacrifice/i.test(t)) return;
  const subs=['Plains','Island','Swamp','Mountain','Forest'].filter(x=>t.includes(x));
  const basicOnly=/basic land card/i.test(t);
  const ok=c=>isLand(c.def) && (basicOnly ? /Basic/.test(c.def.type) : (subs.some(x=>c.def.type.includes(x)) || (!subs.length && /Basic/.test(c.def.type))));
  const need=new Set(p.hand.flatMap(c=>colorsOf(c.def.cost)));
  const sc=c=>landColors(c.def).filter(x=>need.has(x)).length+landColors(c.def).length*0.1;
  const cands=p.lib.filter(ok).sort((x,y)=>sc(y)-sc(x));
  if(/pay 1 life/i.test(t)) p.life-=1;
  moveTo(l,'gy');
  const f=cands[0];
  if(f){ moveTo(f,'bf',{tapped:/battlefield tapped/i.test(t)}); shuffle(p.lib); log(`${p.name}は${nm(l)}を生け贄に捧げ、${nm(f)}を戦場に出した`); }
}
async function npcTurn(p){
  await beat();
  G.phase='main1'; npcPlayLand(p); await beat(); if(G.over) return;
  for(let i=0;i<15 && !G.over && !p.lost;i++){ const ch=npcChooseSpell(p); if(!ch) break; await npcCast(p,ch); checkSBA(); await beat(); }
  if(G.over || p.lost) return;
  npcUsePW(p); npcEquip(p); checkSBA();
  if(G.over || p.lost) return;
  G.phase='combat';
  fireFor(p,'bcombat'); checkSBA();
  const plan=npcAttackPlan(p);
  if(plan.length) await resolveCombat(p, plan); else log(`${p.name}は攻撃しなかった`);
  if(G.over || p.lost) return;
  G.phase='main2'; npcPlayLand(p);
  for(let i=0;i<15 && !G.over && !p.lost;i++){ const ch=npcChooseSpell(p); if(!ch) break; await npcCast(p,ch); checkSBA(); await beat(); }
}
function npcMulligan(p){
  for(let t=0;t<3;t++){
    const lands=p.hand.filter(c=>isLand(c.def)).length;
    if((lands>=2 && lands<=5) || t===2) break;
    p.hand.forEach(c=>{c.zone='lib'; p.lib.push(c);}); p.hand=[]; shuffle(p.lib); drawN(p,7); p.mull++;
  }
  const nb=Math.max(0,p.mull-1);
  for(let i=0;i<nb;i++){
    const c=[...p.hand].sort((x,y)=>(isLand(x.def)?0:x.def.cmc)-(isLand(y.def)?0:y.def.cmc)).pop();
    moveTo(c,'lib',{bottom:true});
  }
  if(p.mull) log(`${p.name}は${p.mull}回マリガンした`);
}

/* ================= ターン進行 ================= */
let waiter=null;
function beat(){
  render();
  if(G.settings.speed==='step' || G.paused) return new Promise(r=>{ waiter=r; render(); });
  return sleep(SPEEDS[G.settings.speed]);
}
function resume(){ if(waiter){ const w=waiter; waiter=null; w(); } }

function beginTurn(p){
  G.turn++; G.phase='untap';
  p.bf.forEach(c=>{ c.tapped=false; c.sick=false; });
  p.landPlayed=false;
  log(`━━ ${p.name}のターン（ラウンド${G.round}）━━`);
  G.phase='upkeep'; fireFor(p,'upkeep'); checkSBA();
  G.phase='draw'; drawN(p,1); checkSBA();
  G.phase='main1';
}
function endTurn(p){
  G.phase='end';
  fireFor(p,'end'); checkSBA();
  for(const q of G.players) for(const c of q.bf){ c.dmg=0; c.dtHit=false; c.tp=0; c.tt=0; c.kwT=null; }
  if(p.npc){
    while(p.hand.length>7){
      const lands=p.hand.filter(c=>isLand(c.def));
      const c = lands.length>3 ? lands[0] : [...p.hand].sort((x,y)=>y.def.cmc-x.def.cmc)[0];
      moveTo(c,'gy'); log(`${p.name}は${nm(c)}を捨てた`);
    }
  } else if(p.hand.length>7) log(`手札が${p.hand.length}枚です。7枚になるよう手動で捨ててください`);
}
function nextActive(){
  let i=G.active, n=0;
  do{ i=(i+1)%4; if(i===G.first) G.round++; n++; } while(G.players[i].lost && n<8);
  G.active=i;
}
async function runTurns(){
  while(!G.over){
    const p=G.players[G.active];
    beginTurn(p);
    if(G.over) return;
    if(!p.npc){ render(); return; }
    await npcTurn(p);
    if(G.over) return;
    endTurn(p); nextActive();
  }
}
async function startGame(){
  for(const p of G.players){ drawN(p,7); if(p.npc) npcMulligan(p); }
  log('ゲーム開始'); render();
  await humanMulligan();
  G.active=rnd(4); G.first=G.active;
  log(`先攻は${G.players[G.active].name}`);
  runTurns();
}

/* ================= あなたの操作 ================= */
const ME = () => G.players[0];
function humanCast(c, auto){
  const p=ME(); const fromCz=c.zone==='cz';
  const extra=fromCz?2*(p.tax[c.uid]||0):0;
  if(auto){
    const pay=findPayment(c.def.cost, [...poolSources(p), ...manaSources(p)], extra);
    if(!pay){
      choiceSheet(`<h3>マナが足りないかもしれません</h3><p class="dim">コスト ${esc(c.def.cost||'なし')}${extra?` ＋統率者税{${extra}}`:''}。自動支払いできる組み合わせが見つかりませんでした。</p>`, ['そのまま唱える（マナは手動）','やめる']).then(r=>{ if(r===0) finishCast(c,fromCz); });
      return;
    }
    applyPayment(pay);
  }
  finishCast(c, fromCz);
}
function finishCast(c, fromCz){
  const p=ME();
  if(fromCz) p.tax[c.uid]=(p.tax[c.uid]||0)+1;
  log(`あなたは${nm(c)}を唱えた`);
  fireFor(p,'cast',t=>spellMatches(t.cond.filter, c.def));
  if(npcTryCounter(p, c)){ moveTo(c,'gy'); checkSBA(); closeSheet(); render(); return; }
  const fx=(c.def.fx||[]).filter(e=>e.do!=='counterspell');
  const isAuraRe=/\bAura\b/.test(c.def.type) && fx.length;
  if(isPermanentDef(c.def) && !isAuraRe){ moveTo(c,'bf'); checkSBA(); closeSheet(); render(); return; }
  moveTo(c,'gy'); checkSBA();
  closeSheet(); render();
  if(fx.length && G.settings.assist && G.mode==='assist'){
    choiceSheet(`<h3>${esc(nm(c))}</h3><p>${esc(fxText(fx))}</p><p class="dim">自動で処理しますか？（対象は自分で選びます）</p>`, ['自動で処理','自分で処理する']).then(r=>{ if(r===0) resolveForHuman(c,fx); });
  }
}
function humanBlocks(dp, ap, attacks){
  return new Promise(resolve=>{
    const elig=dp.bf.filter(b=>isCreature(b.def)&&!b.tapped);
    const sel={}; attacks.forEach(({a})=>sel[a.uid]=new Set());
    let err='';
    const draw=()=>{
      const dmgIn=attacks.filter(({a})=>!sel[a.uid].size).reduce((s,{a})=>s+pow(a),0);
      openSheet(`<h3>${esc(ap.name)}があなたを攻撃！</h3><p class="dim">ブロックするクリーチャーをタップで選択（1体が止められるのは1体まで）</p>`+
        attacks.map(({a})=>{
          const opts=elig.filter(b=>canBlock(b,a));
          return `<div class="blk"><div><b>${esc(nm(a))}</b> ${pow(a)}/${tou(a)} <span class="dim">${esc(a.def.kw.join(' / '))}</span></div><div class="opts">${
            opts.map(b=>`<button class="chip ${sel[a.uid].has(b.uid)?'on':''}" data-blk="${a.uid}:${b.uid}">${esc(nm(b))} ${pow(b)}/${tou(b)}</button>`).join('')||'<span class="dim">ブロックできるクリーチャーなし</span>'}</div></div>`;
        }).join('')+
        `<p>ブロックしない場合の被ダメージ：<b>${dmgIn}</b>点（現在ライフ ${dp.life}）</p>${err?`<div class="err">${err}</div>`:''}<div class="acts"><button class="btn" data-blkok>確定</button><button class="btn sec" data-blknone>ブロックしない</button></div>`,
        e=>{
          const t=e.target.closest('[data-blk],[data-blkok],[data-blknone]'); if(!t) return;
          if(t.dataset.blk){
            const [au,bu]=t.dataset.blk.split(':').map(Number);
            const on=sel[au].has(bu);
            Object.values(sel).forEach(s=>s.delete(bu));
            if(!on) sel[au].add(bu);
            err=''; draw();
          } else {
            if(t.dataset.blknone!==undefined) Object.values(sel).forEach(s=>s.clear());
            const bad=attacks.find(({a})=>hasKw(a,'Menace') && sel[a.uid].size===1);
            if(bad){ err=`${nm(bad.a)}は威迫を持つため2体以上でブロックする必要があります`; draw(); return; }
            const m=new Map();
            attacks.forEach(({a})=>{ if(sel[a.uid].size) m.set(a.uid,[...sel[a.uid]].map(u=>G.cards[u])); });
            closeSheet(true); resolve(m);
          }
        }, true, ()=>{ log('ブロックせずに閉じた'); resolve(new Map()); });
    };
    if(!elig.length){ log('あなたはブロックできるクリーチャーがいない'); resolve(new Map()); return; }
    draw();
  });
}
function humanMulligan(){
  return new Promise(resolve=>{
    const p=ME();
    // カード詳細（戻るボタンで元の画面へ）
    const detail=(c, back)=>{
      openSheet(`${detailHTML(c)}<div class="acts"><button class="btn" data-back>戻る</button></div>`,
        e=>{ if(e.target.closest('[data-back]')) back(); }, true, ()=>back());
    };
    const ask=()=>{
      openSheet(`<h3>初手（マリガン ${p.mull}回目）</h3><div class="tiles">${p.hand.map(c=>tileHTML(c,{noact:true})).join('')}</div>
        <p class="dim">土地 ${p.hand.filter(c=>isLand(c.def)).length}枚。統率者戦では最初のマリガンは無料です。カードをタップすると詳細を見られます。</p>
        <div class="acts"><button class="btn" data-keep>キープ</button><button class="btn sec" data-mull>マリガン</button></div>`,
        e=>{
          const tc=e.target.closest('[data-uid]');
          if(tc){ detail(G.cards[+tc.dataset.uid], ask); return; }
          if(e.target.closest('[data-mull]')){
            p.hand.forEach(c=>{c.zone='lib'; p.lib.push(c);}); p.hand=[]; shuffle(p.lib); drawN(p,7); p.mull++; ask();
          } else if(e.target.closest('[data-keep]')){
            const nb=Math.max(0,p.mull-1);
            if(!nb){ closeSheet(true); resolve(); return; }
            const pick=new Set();
            const bottom=()=>{
              openSheet(`<h3>ライブラリーの下に置くカードを${nb}枚選択</h3><p class="dim">カードをタップで選択。「詳細」で中身を確認できます。</p>
                <div class="tiles">${p.hand.map(c=>`<div style="display:flex;flex-direction:column;align-items:center;gap:3px">${tileHTML(c,{noact:true,sel:pick.has(c.uid)})}<button class="btn sec sm" style="padding:3px 8px;font-size:11px" data-det="${c.uid}">詳細</button></div>`).join('')}</div>
                <div class="acts"><button class="btn" data-bot ${pick.size!==nb?'disabled':''}>決定</button></div>`,
                e2=>{
                  const dt=e2.target.closest('[data-det]');
                  if(dt){ detail(G.cards[+dt.dataset.det], bottom); return; }
                  const t=e2.target.closest('[data-uid]');
                  if(t){ const u=+t.dataset.uid; pick.has(u)?pick.delete(u):(pick.size<nb&&pick.add(u)); bottom(); }
                  else if(e2.target.closest('[data-bot]') && pick.size===nb){ pick.forEach(u=>moveTo(G.cards[u],'lib',{bottom:true})); closeSheet(true); resolve(); }
                }, true, ()=>{
                  const rest=p.hand.filter(c=>!pick.has(c.uid)).sort((x,y)=>(isLand(y.def)?-1:y.def.cmc)-(isLand(x.def)?-1:x.def.cmc));
                  while(pick.size<nb && rest.length) pick.add(rest.shift().uid);
                  pick.forEach(u=>moveTo(G.cards[u],'lib',{bottom:true})); log(`${nb}枚を自動でライブラリーの下に置いた`); resolve();
                });
            };
            bottom();
          }
        }, true, ()=>{ setTimeout(()=>{ ask(); const k=document.querySelector('#sheet [data-keep]'); if(k) k.click(); }); });
    };
    ask();
  });
}
function confirmAttack(){
  const sel=G.ui.attack.map;
  const plan=Object.entries(sel).map(([u,d])=>({a:G.cards[+u], d:+d})).filter(x=>x.a && x.a.zone==='bf' && !G.players[x.d].lost);
  G.ui.attack=null;
  if(!plan.length){ G.phase='main2'; render(); return; }
  resolveCombat(ME(), plan).then(()=>{ if(!G.over){ G.phase='main2'; render(); } });
}
function humanEndTurn(){
  const p=ME(); endTurn(p); nextActive(); render(); runTurns();
}

/* ================= 表示 ================= */
function tileHTML(c, o={}){
  const d=c.def;
  const bg=d.thumb?`style="background-image:url('${esc(d.thumb)}');background-size:contain"`:'';
  const cr=isCreature(d);

function chipHTML(c){

function oppBoardHTML(p){

function barHTML(){

function barMain(){

const WIDTHS={std:['900px','560px'], wide:['1400px','760px'], full:['100%','900px']};

/* ---------- シート（モーダル） ---------- */
let sheetHandler=null, sheetLocked=false, sheetActs=[], sheetOnClose=null;
/* onClose: 「閉じる」を押したときの処理（選ばないと進めない画面では、安全な選択をしたことにする） */
function openSheet(html, handler, locked, onClose){
  $('#sheet').innerHTML=`<div class="shd"><button class="btn sec sm" data-close>閉じる ✕</button></div>`+html;
  sheetHandler=handler||null; sheetLocked=!!locked; sheetOnClose=onClose||null;
  $('#modal').classList.remove('hidden');
  $('#sheet').scrollTop=0;
}
function closeSheet(force){ if(sheetLocked && !force) return; $('#modal').classList.add('hidden'); sheetHandler=null; sheetLocked=false; sheetOnClose=null; }
function choiceSheet(html, labels, cancelIdx){
  const ci = cancelIdx==null ? labels.length-1 : cancelIdx;
  return new Promise(res=>{
    openSheet(html+`<div class="acts">${labels.map((l,i)=>`<button class="btn ${i?'sec':''}" data-ch="${i}">${esc(l)}</button>`).join('')}</div><p class="dim">「閉じる」は「${esc(labels[ci])}」と同じ扱いです。</p>`,
      e=>{ const t=e.target.closest('[data-ch]'); if(t){ closeSheet(true); res(+t.dataset.ch); } }, true, ()=>res(ci));
  });
}
function actSheet(html, acts){
  sheetActs=acts;
  openSheet(html+`<div class="acts">${acts.map(([l],i)=>`<button class="btn sec" data-act="${i}">${esc(l)}</button>`).join('')}</div>`,
    e=>{ const t=e.target.closest('[data-act]'); if(!t) return; const f=sheetActs[+t.dataset.act][1]; const keep=f(); if(keep!=='keep') closeSheet(); render(); });
}
$('#modal').addEventListener('click', e=>{
  if(e.target.closest('[data-close]')){ const f=sheetOnClose; closeSheet(true); if(f) f(); render(); return; }
  if(e.target.id==='modal'){ closeSheet(); return; }
  if(sheetHandler) sheetHandler(e);
});

function detailHTML(c){
  const d=c.def;
  const text=d.jtext||d.text;
  const st=c.zone==='bf'?[c.tapped?'タップ':'アンタップ', c.dmg?`ダメージ${c.dmg}`:'', c.p1?`+1/+1カウンター×${c.p1}`:''].filter(Boolean).join('・'):'';
  return `${d.img?`<img class="cimg" src="${esc(d.img)}" alt="">`:''}
    <h3>${esc(nm(c))}${d.ja&&d.name&&d.ja!==d.name?` <span class="dim">${esc(d.name)}</span>`:''}</h3>
    <div class="dim">${esc(d.cost||'')} ${esc(d.jtype||d.type||(d.unknown?'（カード情報なし）':''))}${isCreature(d)?` ・ ${pow(c)}/${tou(c)}`:''}</div>
    ${text&&!d.img?`<div class="ctext">${esc(text)}</div>`:''}
    ${text&&d.img?`<details><summary class="dim">テキストを表示</summary><div class="ctext">${esc(text)}</div></details>`:''}
    ${st?`<div class="dim" style="margin-top:4px">${esc(st)}</div>`:''}
    ${c.zone==='bf'&&attachmentsOf(c).length?`<div class="dim">つけられている：${attachmentsOf(c).map(a=>esc(nm(a))).join('、')}</div>`:''}
    ${c.attachedTo&&G.cards[c.attachedTo]?`<div class="dim">${esc(nm(G.cards[c.attachedTo]))}についている</div>`:''}
    ${c.def.ward?`<div style="color:var(--gold);font-size:12px">護法：${esc(wardText(c.def.ward))}</div>`:''}
    ${(c.def.fx||[]).length?`<div class="dim">自動処理：${esc(fxText(c.def.fx))}</div>`:''}
    <div class="dim">オーナー：${esc(G.players[c.owner].name)}</div>`;
}
function cardSheet(c){
  const p=ME(); const mine=c.ctrl===0; const z=c.zone; const acts=[];
  const mv=(zone,opt,msg)=>()=>{ moveTo(c,zone,opt); log(msg||`${nm(c)}を移動`); };
  if(z==='hand' && mine){
    if(isLand(c.def)) acts.push(['土地をプレイ',()=>{ moveTo(c,'bf'); p.landPlayed=true; log(`あなたは${nm(c)}をプレイした`); }]);
    else { acts.push(['唱える（自動支払い）',()=>{ humanCast(c,true); return 'keep'; }]); acts.push(['唱える（手動）',()=>{ humanCast(c,false); return 'keep'; }]); }
    acts.push(['戦場に出す（コスト無し）',mv('bf',{},`${nm(c)}を戦場に出した`)],['捨てる',mv('gy',{},`${nm(c)}を捨てた`)],['追放',mv('ex')],['ライブラリーの上へ',mv('lib')],['ライブラリーの下へ',mv('lib',{bottom:true})]);
  }
  if(z==='cz' && mine){
    const tax=2*(p.tax[c.uid]||0);
    acts.push([`唱える（自動・税+${tax}）`,()=>{ humanCast(c,true); return 'keep'; }],[`唱える（手動・税+${tax}）`,()=>{ humanCast(c,false); return 'keep'; }]);
  }
  if(z==='bf'){
    if(mine && !c.tapped){ const ms=manaSources(p).find(s=>s.card===c); if(ms) [...new Set(ms.colors)].forEach(k=>acts.push([`タップして${MANA_JA[k]}マナを浮かせる`,()=>{ const n=Math.max(1,c.def.manaN||1); c.tapped=true; p.pool[k]+=n; log(`${nm(c)}から${MANA_JA[k]}マナを${n}点出した`); if(c.def.oneShot) moveTo(c,'gy'); }])); }
    acts.push([c.tapped?'アンタップ':'タップ',()=>{ c.tapped=!c.tapped; }]);
    if(isCreature(c.def)){
      acts.push([c.sick?'召喚酔いを外す':'召喚酔いを付ける',()=>{ c.sick=!c.sick; log(`${nm(c)}の召喚酔いを${c.sick?'付けた':'外した'}`); }]);
      acts.push(['+1/+1カウンター＋',()=>{ c.p1++; return 'keep'; }],['+1/+1カウンター－',()=>{ c.p1--; checkSBA(); return 'keep'; }]);
      acts.push(['ダメージ＋1',()=>{ c.dmg++; checkSBA(); return c.zone==='bf'?'keep':''; }],['修整 +1/+1（ターン終了まで）',()=>{ c.tp++; c.tt++; return 'keep'; }]);
    }
    if(isPW(c.def) && mine) (c.def.pwAbil||[]).forEach(a=>{
      const lbl=`[${a.cost>0?'+':''}${a.cost}] ${(a.jtext||a.text).replace(/^[^：:]*[：:]\s*/,'').slice(0,26)}`;
      acts.push([lbl, ()=>{ if((c.counters.loyalty||0)+a.cost<0){ G.ticker='忠誠度が足りません'; return; } c.counters.loyalty=(c.counters.loyalty||0)+a.cost; c.pwUsed=G.turn; log(`あなたは${nm(c)}の[${a.cost}]能力を起動した`); checkSBA(); if(a.fx.length){ setTimeout(()=>resolveForHuman(c,a.fx)); } }]);
    });
    if(mine && G.mode==='assist' && (/\bEquipment\b/.test(c.def.type) || /\bAura\b/.test(c.def.type))){
      const attach=(pay)=>()=>{ const cands=G.players.flatMap(q=>q.bf).filter(x=>isCreature(x.def) && (/\bAura\b/.test(c.def.type) || x.ctrl===0));
        setTimeout(()=>{ openSheet(`<h3>${esc(nm(c))}をつけるクリーチャー</h3><div class="seg">${cands.map(x=>`<button class="chip" data-at="${x.uid}">${esc(nm(x))} ${pow(x)}/${tou(x)}</button>`).join('')||'<span class="dim">クリーチャーがいません</span>'}</div>`, ev=>{
          const b=ev.target.closest('[data-at]'); if(!b) return;
          if(pay){ const py=findPayment(c.def.equipCost, [...poolSources(p), ...manaSources(p)], 0); if(!py){ G.ticker='装備コストを自動で支払えませんでした'; closeSheet(true); render(); return; } applyPayment(py); }
          c.attachedTo=+b.dataset.at; log(`${nm(c)}を${nm(G.cards[c.attachedTo])}につけた`); closeSheet(true); render(); }); }); return 'keep'; };
      if(c.def.equipCost) acts.push([`装備する（自動支払い ${c.def.equipCost}）`, attach(true)]);
      acts.push(['クリーチャーにつける（コスト手動）', attach(false)]);
      if(c.attachedTo) acts.push(['外す',()=>{ c.attachedTo=null; }]);
    }
    if(isPW(c.def)) acts.push(['忠誠度＋1',()=>{ c.counters.loyalty=(c.counters.loyalty||0)+1; return 'keep'; }],['忠誠度－1',()=>{ c.counters.loyalty=(c.counters.loyalty||0)-1; checkSBA(); return 'keep'; }]);
    if(c.def.unknown && mine) acts.push(['P/Tを設定',()=>{ ptSheet(c); return 'keep'; }]);
    acts.push(['破壊（墓地へ）',mv('gy',{},`${nm(c)}を墓地に置いた`)],['追放',mv('ex',{},`${nm(c)}を追放した`)],['手札に戻す',mv('hand',{},`${nm(c)}を手札に戻した`)],['ライブラリーの上へ',mv('lib',{},`${nm(c)}をライブラリーの上に置いた`)]);
    if(!mine) acts.push(['コントロールを得る',()=>{ moveTo(c,'bf',{ctrl:0}); log(`あなたは${nm(c)}のコントロールを得た`); }]);
  }
  if(z==='gy' && mine && (c.def.fx||[]).filter(e=>e.do!=='counterspell').length) acts.push(['この呪文の効果を自動処理',()=>{ setTimeout(()=>resolveForHuman(c,c.def.fx.filter(e=>e.do!=='counterspell'))); }]);
  if(z==='gy'||z==='ex'){
    acts.push(['手札へ',mv('hand')],['戦場へ（あなたのコントロール）',()=>{ moveTo(c,'bf',{ctrl:0,noRedirect:true}); log(`${nm(c)}を戦場に出した`); }],['ライブラリーの上へ',mv('lib')]);
    if(z==='gy') acts.push(['追放',mv('ex',{noRedirect:true})]);
    if(c.isCmd) acts.push(['統率領域へ',mv('cz')]);
  }
  if(z==='lib' && mine) acts.push(['手札へ（切り直す）',()=>{ moveTo(c,'hand'); shuffle(p.lib); log(`${nm(c)}をサーチした`); }],['戦場へ（切り直す）',()=>{ moveTo(c,'bf'); shuffle(p.lib); log(`${nm(c)}を戦場に出した`); }],['墓地へ',mv('gy')]);
  if(z==='hand' && !mine){ openSheet(`<p>非公開の手札です</p>`); return; }
  actSheet(detailHTML(c), acts);
}
function ptSheet(c){
  openSheet(`<h3>${esc(nm(c))} のP/T</h3><div style="display:flex;gap:8px;align-items:center"><input id="pp" type="number" value="${num(c.def.power)}" style="width:70px"> / <input id="tt" type="number" value="${num(c.def.toughness)}" style="width:70px"></div>

  });
}
function playerSheet(p){
  const all=G.players.flatMap(q=>q.cz.concat(q.bf,q.gy,q.ex)).filter(c=>c.isCmd && c.owner!==p.idx);
  const acts=[['ライフ −1',()=>{p.life--;checkSBA();return'keep';}],['ライフ ＋1',()=>{p.life++;return'keep';}],['ライフ −5',()=>{p.life-=5;checkSBA();return'keep';}],['ライフ ＋5',()=>{p.life+=5;return'keep';}]];

});

  return `<div class="prog"><div class="pl"><span class="spin"></span>${esc(st)}${pct!=null?`（${pct}%）`:''}</div>
    ${pct!=null?`<div class="pbar"><div style="width:${pct}%"></div></div>`:''}
    <div class="ps">初回は4デッキ分の取得に30秒〜1分ほどかかります。画面を閉じずにお待ちください。</div></div>`;
}
function renderSetup(){
  const r=SETUP.result;
  let res='';
  if(r){
    const total=r.commanders.length+r.main.length;
    res=`<h2>読み込み結果</h2>
      <div>合計 <b>${total}</b> 枚${total!==100?` <span class="miss">（100枚ではありません）</span>`:''}</div>
      ${r.offline?`<div class="miss">カード情報サーバー（Scryfall）に接続できなかったため、カード名だけで読み込みました。土地以外のP/Tなどは対局中に設定できます。</div>`:''}
      ${r.anyFailed?`<div class="miss">通信が混み合っていて、取得できなかったカードが${r.anyFailed}種類あります（NPCのデッキ分を含みます）。少し待ってからもう一度「デッキを読み込む」を押すと、残りの分だけ取得し直します。</div>`:''}
      ${r.failed?.length?`<div class="dim">取得できなかったカード：${r.failed.map(esc).join('、')}</div>`:''}
      ${r.missing.length?`<div class="miss">見つからなかったカード（${r.missing.length}）：${r.missing.map(esc).join('、')}</div><div class="dim">「1 日本語名/English Name」の形で英語名を添えると確実に見つかります。</div>`:''}
      <h2>統率者</h2>
      ${r.commanders.length?`<div>${r.commanders.map(d=>`<b>${esc(d.ja)}</b>`).join(' ＋ ')}</div>`:
        `<div class="dim">統率者の指定がありません。下から選んでください（最大2枚）</div><div class="chips">${r.cands.map((d,i)=>`<button class="chip ${SETUP.cmdPick.includes(i)?'on':''}" data-cp="${i}">${esc(d.ja)}</button>`).join('')}</div>`}
      <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-s="start" ${(!r.commanders.length&&!SETUP.cmdPick.length)?'disabled':''}>ゲーム開始</button>
        ${r.offline?'':`<button class="btn sec" data-s="cover">効果の対応状況を見る</button>`}</div>`;
  }
  $('#app').innerHTML=`<div class="wrap">
    <h1>統率者戦 1人回し</h1>
    <div class="dim">NPC 3人を相手に統率者戦を練習するツールです。</div>
    <h2>あなたのデッキ</h2>
    <div class="dim">晴れる屋のデッキ構築からコピーした日本語テキストを貼り付けてください。</div>
    <textarea id="deck" placeholder="${esc(SAMPLE_HINT)}">${esc(store.get('deck',''))}</textarea>
    <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
      <button class="btn" data-s="load" ${SETUP.busy?'disabled':''}>デッキを読み込む</button>
      <button class="btn sec" data-s="sample" ${SETUP.busy?'disabled':''}>仮デッキで試す</button>
    </div>
    <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center">
      <label class="btn sec sm" style="display:inline-block">テキストファイルから読み込む<input type="file" id="deckfile" accept=".txt,text/plain" style="display:none"></label>
      <button class="btn sec sm" data-s="teval">サンプル：テヴァル</button>
      <button class="btn sec sm" data-s="trostani">サンプル：トロスターニ</button>
      <button class="btn sec sm" data-s="dragon">サンプル：始祖ドラゴン</button>
    </div>
    ${progHTML()}
    ${res}
    <h2>表示領域の幅（PC向け）</h2>
    <div class="seg">${[['std','標準'],['wide','広い'],['full','画面いっぱい']].map(([k,l])=>`<button class="chip ${(store.get('settings',{}).width||'std')===k?'on':''}" data-wds="${k}">${l}</button>`).join('')}</div>
    <div class="dim" style="margin-top:4px">ゲーム中も右上の「設定」から変更できます。</div>
    <h2>自分のカード効果の処理</h2>
    <div class="seg">${[['assist','補助あり（自動処理を提案）（テスト版）'],['manual','すべて手動']].map(([k,l])=>`<button class="chip ${store.get('mode','assist')===k?'on':''}" data-md="${k}">${l}</button>`).join('')}</div>
    <div class="dim" style="margin-top:4px">${store.get('mode','assist')==='manual'?'自分のカードの効果・誘発・装備・全体強化はすべて自分で操作します（NPC側は自動のまま）。':'【テスト版】呪文の効果や誘発型能力を、対象を選ぶだけで自動処理できます。カードによっては正しく処理できないことがあります。'}</div>
    <h2>対戦相手</h2>
    ${npcSummary()}
    <p class="dim" style="margin-top:24px;line-height:1.6">カード情報・画像：<a href="https://scryfall.com" style="color:var(--dim)">Scryfall</a> を利用しています。<br>本ツールは非公式のファンツールで、Wizards of the Coast および Scryfall とは関係ありません。マジック：ザ・ギャザリングのカード名・画像の権利は Wizards of the Coast に帰属します。</p>
  </div>`;
}
async function loadDeck(){
  const text=$('#deck').value; store.set('deck',text);
  const parsed=parseDeck(text);
  if(!parsed.main.length && !parsed.commander.length){ SETUP.status='カードが読み取れませんでした。「1 カード名」の形式か確認してください。'; renderSetup(); return; }
  if(text!==TROSTANI_SAMPLE) SETUP.autoCmd=null;
  SETUP.busy=true; SETUP.result=null; SETUP.cmdPick=[]; SETUP.status='カード情報を取得中…'; renderSetup();
  const npcParsed=NPC_LISTS.map(t=>t?parseDeck(t):null);
  const all=[...parsed.commander, ...parsed.main, ...npcParsed.filter(Boolean).flatMap(d=>[...d.commander,...d.main])];
  let map, offline=false, failed=new Set();
  try{ const r=await resolveCards(all, s=>{ SETUP.status=s; renderSetup(); }); map=r.map; failed=new Set(r.failed); }
  catch(err){ offline=true; map=new Map(); }
  const key=e=>e.ja||e.en; const missing=[];
  const get=e=>{ const k=key(e); let d=map.get(k); if(!d){ d=basicByName(k)||placeholderDef(e); if(!basicByName(k)&&!offline&&!failed.has(k)) missing.push(k); } return d; };
  const commanders=parsed.commander.flatMap(e=>Array.from({length:e.n},()=>get(e)));
  const main=parsed.main.flatMap(e=>Array.from({length:e.n},()=>mkDef(get(e))));
  const cands=[...new Map(main.filter(d=>isLegendary(d)||d.unknown).filter(d=>!isLand(d)).map(d=>[d.ja,d])).values()];
  if(!commanders.length && SETUP.autoCmd){ const i=cands.findIndex(d=>normJa(d.ja)===normJa(SETUP.autoCmd)); SETUP.cmdPick = i>=0?[i]:[]; }
  const myFailed=[...new Set([...parsed.commander,...parsed.main].map(key).filter(k=>failed.has(k)))];
  SETUP.result={commanders, main, missing:[...new Set(missing)], failed:myFailed, anyFailed:failed.size, offline, cands};
  NPC_READY=npcParsed.map((d,i)=>{
    if(!d || offline) return null;
    const miss=[];
    const fl=[];
    const g=e=>{ const k=key(e); const x=map.get(k)||basicByName(k); if(!x){ (failed.has(k)?fl:miss).push(k); return placeholderDef(e); } return x; };
    const cmds=d.commander.flatMap(e=>Array.from({length:e.n},()=>prepareNpcDef(mkDef(g(e)))));
    const mn=d.main.flatMap(e=>Array.from({length:e.n},()=>prepareNpcDef(mkDef(g(e)))));
    const cn=cmds[0]?.ja||'?';
    return {name:(cn.split('、').pop()||cn), deckName:cn, commanders:cmds, main:mn, missing:[...new Set(miss)], failed:[...new Set(fl)]};
  });
  SETUP.busy=false; SETUP.status=offline?'オフラインで読み込みました':(failed.size?`読み込み完了（通信エラーで${failed.size}種類を取得できませんでした）`:'読み込み完了');
  renderSetup();
}
document.addEventListener('input', e=>{ if(e.target.id==='deck') store.set('deck', e.target.value); });
document.addEventListener('change', async e=>{
  if(e.target.id!=='deckfile' || !e.target.files[0]) return;
  const t=await e.target.files[0].text(); store.set('deck',t); $('#deck').value=t; SETUP.status='ファイルを読み込みました'; renderSetup();
});
function currentNpcDecks(){
  const ph=PLACEHOLDER_DECKS.map(f=>f());
  return [0,1,2].map(i=>NPC_READY[i]?{...NPC_READY[i], commanders:NPC_READY[i].commanders.map(d=>mkDef(d)), main:NPC_READY[i].main.map(d=>mkDef(d))}:ph[i]);
}
function npcSummary(){
  const ph=PLACEHOLDER_DECKS.map(f=>f());
  return [0,1,2].map(i=>{
    const r=NPC_READY[i];
    if(r) return `<div>NPC${i+1}：<b>${esc(r.deckName)}</b>（${r.commanders.length+r.main.length}枚）${r.missing.length?`<div class="miss">見つからない：${r.missing.map(esc).join('、')}</div>`:''}${r.failed.length?`<div class="dim">通信エラーで未取得：${r.failed.length}種類</div>`:''}</div>`;
    const planned=NPC_LISTS[i]?'（指定デッキは「デッキを読み込む」で準備されます）':'（デッキ未指定）';
    return `<div>NPC${i+1}：仮デッキ「${esc(ph[i].deckName)}」<span class="dim">${planned}</span></div>`;
  }).join('');
}
function coverageDecks(){
  const r=SETUP.result; const out=[];
  if(r) out.push({name:'あなた', defs:[...r.commanders,...r.main]});
  NPC_READY.forEach((d,i)=>{ if(d) out.push({name:`NPC${i+1}（${d.name}）`, defs:[...d.commanders,...d.main]}); });
  return out.map(d=>{
    const uniq=[...new Map(d.defs.map(x=>[x.ja||x.name, x])).values()].map(x=>prepareDef(mkDef(x)));
    const rows=uniq.map(x=>({def:x, a:analyzeDef(x)})).filter(r=>r.a.st!=='land');
    return {name:d.name, rows};
  });
}
function coverageSheet(idx=0){
  const decks=coverageDecks(); if(!decks.length) return;
  const d=decks[idx];
  const L={auto:['✓','自動','var(--green)'], partial:['△','一部','var(--gold)'], none:['×','本体のみ','#ff8a80']};
  const cnt=k=>d.rows.filter(r=>r.a.st===k).length;
  const order={none:0,partial:1,auto:2};
  const rows=[...d.rows].sort((x,y)=>order[x.a.st]-order[y.a.st]);
  openSheet(`<h3>効果の対応状況</h3>
    <div class="seg">${decks.map((x,i)=>`<button class="chip ${i===idx?'on':''}" data-cv="${i}">${esc(x.name)}</button>`).join('')}</div>
    <p>✓自動 <b>${cnt('auto')}</b>　△一部 <b>${cnt('partial')}</b>　×本体のみ <b>${cnt('none')}</b>（土地を除く）</p>
    <p class="dim">NPCは✓と△の自動部分を使います。×のカードは、クリーチャーなら体だけ出して戦い、それ以外の呪文は使いません。あなたのカードは、✓や△の部分を唱えたときに自動処理できます。</p>
    <div class="acts"><button class="btn sm" data-cp>未対応カードの英語テキストをコピー</button></div><div id="cpmsg" class="dim"></div>
    ${rows.map(r=>`<div class="blk"><span style="color:${L[r.a.st][2]};font-weight:700">${L[r.a.st][0]}</span> <b>${esc(r.def.ja)}</b> <span class="dim">${esc(r.def.name)}</span>
      ${r.a.st!=='auto'?`<div class="dim" style="margin-top:3px">${r.a.lines.map(l=>`${l.ok?'✓':'×'} ${esc(l.l)}`).join('<br>')}</div>`:(r.def.fx?.length||r.def.trig?.length?`<div class="dim">${esc(fxText([...(r.def.fx||[]),...(r.def.trig||[]).flatMap(t=>t.fx)]))}</div>`:'')}</div>`).join('')}`,
    e=>{
      const b=e.target.closest('[data-cv]'); if(b){ coverageSheet(+b.dataset.cv); return; }
      if(e.target.closest('[data-cp]')){
        const txt=`【${d.name}】未対応・一部対応のカード\n\n`+rows.filter(r=>r.a.st!=='auto').map(r=>`${r.def.ja} / ${r.def.name}\n${r.def.type}\n${stripReminder(r.def.text)}\n`).join('\n');
        const done=()=>{ $('#cpmsg').textContent='コピーしました。チャットに貼り付けてください。'; };
        if(navigator.clipboard?.writeText) navigator.clipboard.writeText(txt).then(done).catch(()=>showCopyBox(txt)); else showCopyBox(txt);
      }
    });
}
function showCopyBox(txt){
  openSheet(`<h3>テキスト</h3><p class="dim">全選択してコピーしてください。</p><textarea id="cpbox" style="min-height:300px">${esc(txt)}</textarea>`);
  setTimeout(()=>{ const t=$('#cpbox'); if(t){ t.focus(); t.select(); } },50);
}
function setupClick(e){
  const wds=e.target.closest('[data-wds]'); if(wds){ store.set('deck',$('#deck').value); const st=store.get('settings',{}); st.width=wds.dataset.wds; store.set('settings',st); render(); return; }
  const md=e.target.closest('[data-md]'); if(md){ store.set('deck',$('#deck').value); store.set('mode',md.dataset.md); renderSetup(); return; }
  const s=e.target.closest('[data-s]'); const cp=e.target.closest('[data-cp]');
  if(cp){ const i=+cp.dataset.cp; const a=SETUP.cmdPick; a.includes(i)?a.splice(a.indexOf(i),1):(a.length<2&&a.push(i)); store.set('deck',$('#deck').value); renderSetup(); return; }
  if(!s) return;
  if(s.dataset.s==='load') loadDeck();
  if(s.dataset.s==='cover') coverageSheet(0);
  if(s.dataset.s==='teval'){ store.set('deck', TEVAL_SAMPLE); SETUP.result=null; SETUP.status='テヴァルのデッキを入れました。「デッキを読み込む」を押してください'; renderSetup(); }
  if(s.dataset.s==='dragon'){ store.set('deck', DRAGON_SAMPLE); SETUP.autoCmd=null; SETUP.result=null; SETUP.status='始祖ドラゴンのデッキを入れました。「デッキを読み込む」を押してください'; renderSetup(); }
  if(s.dataset.s==='trostani'){ store.set('deck', TROSTANI_SAMPLE); SETUP.autoCmd='セレズニアの声、トロスターニ'; SETUP.result=null; SETUP.status='トロスターニのデッキを入れました。「デッキを読み込む」を押してください'; renderSetup(); }
  if(s.dataset.s==='sample'){ const d=PLACEHOLDER_DECKS[rnd(3)](); newGame({commanders:d.commanders, main:d.main}, currentNpcDecks()); render(); startGame(); }
  if(s.dataset.s==='start'){
    const r=SETUP.result; let cmd=r.commanders, main=r.main;
    if(!cmd.length){
      cmd=SETUP.cmdPick.map(i=>r.cands[i]);
      main=main.slice(); cmd.forEach(cd=>{ const i=main.findIndex(d=>d.ja===cd.ja); if(i>=0) main.splice(i,1); });
    }
    newGame({commanders:cmd.map(d=>mkDef(d)), main:main.map(d=>mkDef(d))}, currentNpcDecks()); render(); startGame();
  }
}
render();
</script>
